-06"},{"id":"people/raul-bautista","n":{"en":"Raul Bautista","vi":"Raul Bautista"},"s":"official","t":{"en":"Veteran bank robber who recruits crews for heists.","vi":"Tay cướp nhà băng lão luyện, chuyên tuyển người cho các phi vụ."},"u":"https://www.gtavice.net/characters#raul-bautista","d":"2025-05-06"},{"id":"people/brian-heder","n":{"en":"Brian Heder","vi":"Brian Heder"},"s":"official","t":{"en":"Old-school drug runner with a boat yard; lets Jason live there rent-free.","vi":"Dân buôn lâu năm có bãi thuyền; cho Jason ở miễn phí."},"u":"https://www.gtavice.net/characters#brian-heder","d":"2025-05-06"}]},{"k":"map","n":{"en":"Leonida","vi":"Leonida"},"x":0,"items":[{"id":"map/vice-city","n":{"en":"Vice City","vi":"Vice City"},"s":"official","t":{"en":"The state's largest city and main setting (Miami). \"Everything in Excess.\"","vi":"Thành phố lớn nhất, bối cảnh chính (Miami). \"Everything in Excess.\""},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2023-12-04"},{"id":"map/leonida-keys","n":{"en":"Leonida Keys","vi":"Leonida Keys"},"s":"official","t":{"en":"Tropical island chain with a party mood (Florida Keys). \"Gateway to Paradise.\"","vi":"Chuỗi đảo nhiệt đới, không khí tiệc tùng (Florida Keys). \"Gateway to Paradise.\""},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2025-05-06"},{"id":"map/grassrivers","n":{"en":"Grassrivers","vi":"Grassrivers"},"s":"official","t":{"en":"Vast, dangerous wetlands full of alligators (Everglades). \"Welcome to the Wetlands.\"","vi":"Vùng đầm lầy rộng và nguy hiểm, đầy cá sấu (Everglades). \"Welcome to the Wetlands.\""},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2025-05-06"},{"id":"map/port-gellhorn","n":{"en":"Port Gellhorn","vi":"Port Gellhorn"},"s":"official","t":{"en":"Neglected west coast of cheap motels (Panama City). \"Live Hard.\"","vi":"Bờ tây bị bỏ quên, nhà nghỉ rẻ tiền (Panama City). \"Live Hard.\""},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2025-05-06"},{"id":"map/ambrosia","n":{"en":"Ambrosia","vi":"Ambrosia"},"s":"official","t":{"en":"Farming and industry around a sugar refinery, home of a biker gang (Lake Okeechobee). \"Keeping Leonida Sweet.\"","vi":"Nông nghiệp và công nghiệp quanh nhà máy đường, địa bàn băng biker (hồ Okeechobee). \"Keeping Leonida Sweet.\""},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2025-05-06"},{"id":"map/mount-kalaga-national-park","n":{"en":"Mount Kalaga National Park","vi":"Mount Kalaga National Park"},"s":"official","t":{"en":"Northern hills and off-road trails. \"Wild, Wild Country.\"","vi":"Đồi núi phía bắc và đường địa hình. \"Wild, Wild Country.\""},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2025-05-06"},{"id":"map/hamlet","n":{"en":"Hamlet","vi":"Hamlet"},"s":"official","t":{"en":"Sprawling suburbs south of the city (Homestead, Cutler Bay); named in a Trailer 1 social post.","vi":"Vùng ngoại ô phía nam thành phố (Homestead, Cutler Bay); được nhắc trong một bài mạng xã hội ở Trailer 1."},"u":"https://www.gtavice.net/setting-and-story","d":"2023-12-04"},{"id":"map/military-base","n":{"en":"Military base","vi":"Military base"},"s":"report","t":{"en":"Airfields seen in official screenshots (Naval Air Station Key West); location unclear.","vi":"Sân bay quân sự thấy trong ảnh chính thức (NAS Key West); chưa rõ vị trí."},"u":"https://www.gtavice.net/setting-and-story","d":"2025-05-06"},{"id":"map/bluegrass-watson-bay","n":{"en":"Bluegrass · Watson Bay","vi":"Bluegrass · Watson Bay"},"s":"report","t":{"en":"Farmland outside Hamlet, and a fishing town turned tourist spot; listed by fan mapping, no reveal date.","vi":"Vùng nông trại ngoài Hamlet, và thị trấn chài chuyển sang du lịch; do fan lập bản đồ, chưa rõ ngày hé lộ."},"u":"https://www.gtavice.net/setting-and-story"}]},{"k":"wanted","n":{"en":"Wanted Level","vi":"Truy nã"},"x":0,"items":[{"id":"wanted/six-star-wanted-level","n":{"en":"Six-star wanted level","vi":"Truy nã 6 sao"},"s":"official","t":{"en":"Six stars return for the first time since GTA IV. Previews describe one star as fairly easy to shake and the top level as a map-wide search; the exact requirement for each star has not been published.","vi":"6 sao trở lại lần đầu kể từ GTA IV. Các bài preview mô tả 1 sao khá dễ cắt đuôi, mức cao nhất là lùng khắp bản đồ; điều kiện chính xác cho từng sao chưa được công bố."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-08-27"},{"id":"wanted/star-states-hollow-solid-flashing-red","n":{"en":"Star states: hollow, solid, flashing, red","vi":"Các trạng thái sao: rỗng, đặc, nhấp nháy, đỏ"},"s":"report","t":{"en":"Hollow: a crime was reported but police have no description. Solid white: you are identified and in sight. Flashing white: line of sight broken, pursuit continues. Red: you escaped the chase but are still inside the search zone.","vi":"Rỗng: đã có báo án nhưng cảnh sát chưa có mô tả. Trắng đặc: bị nhận diện và đang trong tầm nhìn. Trắng nhấp nháy: mất dấu nhưng vẫn truy đuổi. Đỏ: đã thoát cuộc rượt nhưng còn trong vùng truy lùng."},"u":"https://www.gtabase.com/articles/gta-6/gta-6-wanted-level-explained-police-system-guide","d":"2026-10-04"},{"id":"wanted/witnesses-alarms-cctv-trackers","n":{"en":"Witnesses, alarms, CCTV, trackers","vi":"Nhân chứng, báo động, CCTV, định vị"},"s":"report","t":{"en":"A crime nobody sees may bring no wanted level. Witnesses who call it in, store alarms, cameras and car trackers all alert the police.","vi":"Gây án mà không ai thấy có thể không bị truy nã. Nhân chứng gọi báo, chuông báo động, camera và thiết bị định vị trên xe đều báo cho cảnh sát."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"wanted/evidence-icons","n":{"en":"Evidence icons","vi":"Biểu tượng bằng chứng"},"s":"report","t":{"en":"Under the stars, separate icons track what police have on you: appearance, outfit, vehicle, weapon, CCTV footage and your partner. Each is cleared on its own; the convenience-store robbery in the Extended Look shows CCTV, outfit, face and weapon icons, with the vehicle added once the car is seen.","vi":"Dưới các sao có các biểu tượng riêng cho từng thứ cảnh sát nắm: ngoại hình, quần áo, xe, vũ khí, đoạn camera và người đồng hành. Mỗi thứ được xoá riêng; vụ cướp cửa hàng tiện lợi trong Extended Look hiện biểu tượng CCTV, quần áo, khuôn mặt, vũ khí, thêm biểu tượng xe khi xe bị nhìn thấy."},"u":"https://www.wikigtavi.com/guides/gta-6-wanted-system","d":"2026-08-27"},{"id":"wanted/masks-disguises","n":{"en":"Masks & disguises","vi":"Mặt nạ & cải trang"},"s":"report","t":{"en":"A face wrap worn during the crime keeps your face out of the description. Glasses or a hat do not break it; a whole new outfit is needed to clear the clothing icon.","vi":"Khăn che mặt đeo lúc gây án giúp khuôn mặt không vào mô tả. Kính hay mũ không đủ; muốn xoá biểu tượng quần áo cần đổi cả bộ đồ."},"u":"https://www.wikigtavi.com/guides/gta-6-wanted-system","d":"2026-08-27"},{"id":"wanted/hot-areas","n":{"en":"Hot Areas","vi":"Vùng nóng"},"s":"report","t":{"en":"After you escape, police keep searching a marked zone, shown as a red area inside a larger lighter ring. Coming back too soon can re-identify you unless the icons are cleared; at six stars the zone can cover the whole map.","vi":"Sau khi thoát, cảnh sát vẫn lùng một vùng đánh dấu, hiện là vùng đỏ trong vòng ngoài nhạt hơn. Quay lại quá sớm có thể bị nhận diện lại nếu chưa xoá biểu tượng; ở 6 sao vùng này có thể phủ cả bản đồ."},"u":"https://www.gtabase.com/articles/gta-6/gta-6-wanted-level-explained-police-system-guide","d":"2026-10-04"},{"id":"wanted/criminal-profile","n":{"en":"Criminal Profile","vi":"Hồ sơ tội phạm"},"s":"report","t":{"en":"Clean, professional crimes help it; reckless violence hurts it and makes later police responses harsher. It can shatter for good.","vi":"Phạm tội gọn gàng, chuyên nghiệp thì hồ sơ tốt lên; bạo lực bừa bãi làm nó xấu đi và cảnh sát về sau sẽ mạnh tay hơn. Hồ sơ có thể vỡ vĩnh viễn."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-08-29"},{"id":"wanted/criminal-profile-states","n":{"en":"Criminal Profile states","vi":"Các mức Hồ sơ tội phạm"},"s":"report","t":{"en":"Four named states from preview reports: Professional, Aggressive, Violent, Psycho. Rob Nelson describes it as a measure of unnecessary behaviour over time. Beyond Psycho an unnamed state cracks and shatters the icon for good. Jason and Lucia each have their own profile.","vi":"Bốn mức theo các bài preview: Professional, Aggressive, Violent, Psycho. Rob Nelson mô tả đây là thước đo hành vi thừa thãi theo thời gian. Vượt qua Psycho là một mức chưa đặt tên, biểu tượng nứt rồi vỡ vĩnh viễn. Jason và Lucia mỗi người có hồ sơ riêng."},"u":"https://www.pcgamer.com/games/grand-theft-auto/gta-6s-criminal-profile-system-sounds-pretty-interesting-isnt-a-direct-copy-of-red-deads-honor-system/","d":"2026-08-29"},{"id":"wanted/no-radar-blips-focus","n":{"en":"No radar blips · Focus","vi":"Không hiện trên radar · Focus"},"s":"report","t":{"en":"Police no longer show on the minimap during chases; you watch the street, or use Focus to spot officers and threats.","vi":"Cảnh sát không còn hiện trên minimap khi truy đuổi; bạn phải nhìn đường, hoặc dùng Focus để thấy cảnh sát và mối nguy."},"u":"https://www.gtavice.net/news/esquire-reveals-more-gta-6-details-police-radar-changes-throwable-dog-poop-bags-joint-bank-account-and-more","d":"2026-08-29"},{"id":"wanted/losing-the-heat","n":{"en":"Losing the heat","vi":"Cắt đuôi"},"s":"official","t":{"en":"Change clothes (spare outfits live in your car's trunk), switch cars, or split up when police are hunting a couple. At three stars, get off the street and into the alleys on foot.","vi":"Thay đồ (đồ dự phòng để trong cốp xe), đổi xe, hoặc tách nhau ra khi cảnh sát đang tìm một cặp. Ở mức 3 sao, rời đường lớn và chạy bộ vào hẻm."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"wanted/tyres-impound","n":{"en":"Tyres & impound","vi":"Bắn lốp & giam xe"},"s":"report","t":{"en":"Police shoot out tyres, and a flat is much harder to drive on. An abandoned personal vehicle can be surrounded and impounded; getting it back later costs more.","vi":"Cảnh sát bắn lốp, và chạy xe xịt lốp khó hơn nhiều. Xe cá nhân bỏ lại có thể bị bao vây và kéo về bãi; lấy lại sau đó tốn tiền hơn."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"wanted/non-lethal-escapes","n":{"en":"Non-lethal escapes","vi":"Thoát không cần giết"},"s":"official","t":{"en":"Famitsu interview with Rob Nelson: stars are tuned by hand and you can escape without killing. Shooting out a police car's tyres flipped it and Jason chose not to kill the officers; firing to miss pins police behind cover to break line of sight. A full two-star escape means removing the mask, holstering the gun, stealing a beat-up car, driving carefully and changing outfits.","vi":"Phỏng vấn Famitsu với Rob Nelson: các mức sao được chỉnh tay và có thể thoát mà không giết ai. Bắn lốp làm xe cảnh sát lật, Jason chọn không giết sĩ quan; bắn trượt áp chế khiến cảnh sát nép sau vật cản để mất tầm nhìn. Thoát trọn vẹn ở 2 sao nghĩa là tháo mặt nạ, cất súng, trộm một chiếc xe cũ, lái cẩn thận và thay đồ."},"u":"https://www.gtavice.net/news/gta-6-famitsus-full-rob-nelson-interview-translated-into-english","d":"2026-08-28"},{"id":"wanted/getaways-that-fade","n":{"en":"Getaways that fade","vi":"Thoát truy đuổi"},"s":"official","t":{"en":"The Extended Look shows the wanted meter cooling down during a getaway: duck into alleys, switch vehicles. Torching a car the police recognise removes its vehicle icon instantly.","vi":"An Extended Look cho thấy mức truy nã nguội dần khi tẩu thoát: lẩn vào hẻm, đổi xe. Đốt chiếc xe mà cảnh sát đã nhận diện sẽ xoá ngay biểu tượng xe."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-08-27"},{"id":"wanted/splitting-up","n":{"en":"Splitting up","vi":"Tách nhau ra"},"s":"report","t":{"en":"When police know they are hunting a pair, Jason and Lucia can split up to clear the companion icon and cut the wanted level by a star.","vi":"Khi cảnh sát biết đang tìm một cặp, Jason và Lucia có thể tách nhau để xoá biểu tượng người đồng hành và giảm 1 sao."},"u":"https://www.gtabase.com/articles/gta-6/gta-6-wanted-level-explained-police-system-guide","d":"2026-10-04"},{"id":"wanted/leonida-department-of-corrections","n":{"en":"Leonida Department of Corrections","vi":"Leonida Department of Corrections"},"s":"official","t":{"en":"State prison system; Lucia is in its custody in Trailer 1.","vi":"Hệ thống trại giam của bang; Lucia bị giam ở đây trong Trailer 1."},"u":"https://www.gtavice.net/gangs","d":"2023-12-04"},{"id":"wanted/police-sheriffs","n":{"en":"Police & sheriffs","vi":"Cảnh sát & cảnh sát hạt"},"s":"official","t":{"en":"Vice City, Vice City Beach, Port Gellhorn and Ambrosia police; Vice-Dale, Leonard and Mariana county sheriffs; Leonida Highway Patrol; NOOSE.","vi":"Cảnh sát Vice City, Vice City Beach, Port Gellhorn, Ambrosia; cảnh sát các hạt Vice-Dale, Leonard, Mariana; Leonida Highway Patrol; NOOSE."},"u":"https://www.gtavice.net/gangs"},{"id":"wanted/gangs","n":{"en":"Gangs","vi":"Băng nhóm"},"s":"official","t":{"en":"San4San (Raymond, tied to Boobie Ike), Final Chapter MC (Ambrosia bikers), PTT Youngin$ and the Guardia Brothers.","vi":"San4San (Raymond, có quan hệ với Boobie Ike), Final Chapter MC (biker Ambrosia), PTT Youngin$ và Guardia Brothers."},"u":"https://www.gtavice.net/gangs"}]},{"k":"heists","n":{"en":"Robberies","vi":"Trộm cướp"},"x":0,"items":[{"id":"heists/start-small-earn-the-big-jobs","n":{"en":"Start small, earn the big jobs","vi":"Khởi đầu nhỏ, việc lớn đến sau"},"s":"report","t":{"en":"Early on Jason and Lucia can only hotwire low-end cars and pick basic locks; bigger jobs unlock later in the story. Rob Nelson describes them as a young couple with their backs against the wall, which is why the first jobs are small.","vi":"Đầu game Jason và Lucia chỉ nổ máy được xe rẻ tiền và phá ổ khoá cơ bản; việc lớn hơn mở dần theo cốt truyện. Rob Nelson mô tả họ là cặp đôi trẻ bị dồn vào chân tường, nên các phi vụ đầu khá nhỏ."},"u":"https://www.vice.com/en/article/gta-6-gameplay-details-guardian-interview/","d":"2026-11-14"},{"id":"heists/scout-before-you-rob","n":{"en":"Scout before you rob","vi":"Do thám trước khi cướp"},"s":"report","t":{"en":"Some robberies can be prepared: find a back entrance or the safe code, and disable the cameras or take their footage, so you can get in without threatening anyone. Careless play brings police and helicopters.","vi":"Một số phi vụ có thể chuẩn bị trước: tìm cửa sau hoặc mật mã két, vô hiệu camera hoặc lấy băng ghi hình để vào mà không phải đe doạ ai. Làm ẩu thì cảnh sát và trực thăng kéo tới."},"u":"https://www.keengamer.com/articles/news/rockstar-reveals-new-grand-theft-auto-vi-gameplay-details-days-before-launch/","d":"2026-11-14"},{"id":"heists/jewellery-store-demo-gone-wrong","n":{"en":"Jewellery-store demo gone wrong","vi":"Demo tiệm trang sức đổ bể"},"s":"report","t":{"en":"In the Guardian's demo a guard upstairs opened fire, Jason knocked him out, police and a helicopter arrived and the couple ended up hiding on the city's outskirts.","vi":"Trong bản demo của Guardian, một bảo vệ trên lầu nổ súng, Jason hạ gục ông ta, cảnh sát và trực thăng kéo tới, cặp đôi phải trốn ở vùng ngoại ô."},"u":"https://www.keengamer.com/articles/news/rockstar-reveals-new-grand-theft-auto-vi-gameplay-details-days-before-launch/","d":"2026-11-14"},{"id":"heists/luxury-cars-fitted-tracker","n":{"en":"Luxury cars: fitted tracker","vi":"Xe sang: có sẵn thiết bị định vị"},"s":"report","t":{"en":"Per El Rubius's account of the July preview, a stolen high-end car comes with a police tracker, and removing it reportedly costs a fee at a specific garage. Second-hand creator account, not shown by Rockstar.","vi":"Theo lời kể của El Rubius về buổi preview tháng 7, xe sang bị trộm có sẵn định vị của cảnh sát, và gỡ nó được cho là phải trả phí ở một gara nhất định. Đây là lời kể lại của creator, Rockstar chưa chiếu."},"u":"https://gtasix.org/en/news/gta6-rockstar-preview-gameplay-details/","d":"2026-09-01"},{"id":"heists/store-hold-ups","n":{"en":"Store hold-ups","vi":"Cướp cửa hàng"},"s":"official","t":{"en":"Gas station and shop robberies in bandanas, with one partner grabbing the cash and the other driving.","vi":"Cướp trạm xăng và cửa hàng với khăn bịt mặt, một người gom tiền, người kia lái xe."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-08-27"},{"id":"heists/rob-pretty-much-anything","n":{"en":"Rob pretty much anything","vi":"Cướp gần như mọi thứ"},"s":"official","t":{"en":"Rockstar's Rob Nelson: robberies are a huge part of free roam; even a headphone shop is a target. Park a getaway car outside first.","vi":"Rob Nelson của Rockstar: trộm cướp là phần lớn của chơi tự do; đến cả tiệm tai nghe cũng cướp được. Nên đỗ sẵn xe tẩu thoát bên ngoài."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"heists/safes","n":{"en":"Safes","vi":"Két sắt"},"s":"official","t":{"en":"Find the combination or blow it open; explosives damage some of the valuables. Stay too long and police gather outside, so use the back door.","vi":"Tìm mã két hoặc cho nổ; thuốc nổ làm hỏng một phần đồ giá trị. Ở lâu cảnh sát sẽ tập trung trước cửa, nên chạy cửa sau."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"heists/masks-bags-focus","n":{"en":"Masks, bags & Focus","vi":"Mặt nạ, túi & Focus"},"s":"report","t":{"en":"Mask up and hide the gun before you walk in. Bags limit how much loot you carry (spares go in the car); Focus picks out jewellery and other valuables.","vi":"Đeo mặt nạ và giấu súng trước khi vào. Túi giới hạn lượng đồ mang được (túi dự phòng để trên xe); Focus làm nổi đồ trang sức và đồ giá trị."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"heists/fences-pawn-shops","n":{"en":"Fences & pawn shops","vi":"Chỗ tiêu thụ đồ gian"},"s":"report","t":{"en":"Stolen goods are sold to fences and pawn shops.","vi":"Đồ ăn cắp được bán cho người tiêu thụ đồ gian và tiệm cầm đồ."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"heists/car-theft-in-layers","n":{"en":"Car theft in layers","vi":"Trộm xe nhiều lớp"},"s":"official","t":{"en":"Old cars: crowbar and hotwire. New ones: alarms, trackers and electronic keys that need cloners and later-game tools. Drivers can always be carjacked; damaged cars sell for less.","vi":"Xe cũ: xà beng và nối dây. Xe mới: báo động, định vị và chìa điện tử, cần máy sao chép khoá và công cụ về sau. Luôn cướp được xe đang có người lái; xe hỏng bán rẻ hơn."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"heists/gang-compounds","n":{"en":"Gang compounds","vi":"Sào huyệt băng đảng"},"s":"report","t":{"en":"Compounds across Leonida hold cash, drugs and valuables to raid; one is tied to the Ultimate Edition.","vi":"Các sào huyệt khắp Leonida chứa tiền, ma tuý và đồ giá trị để đột kích; một nơi gắn với bản Ultimate."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"heists/joint-bank-account","n":{"en":"Joint bank account","vi":"Tài khoản chung"},"s":"report","t":{"en":"Banked money is shared by Jason and Lucia; cash in pocket is separate and can be lost if that character goes down.","vi":"Tiền gửi ngân hàng là của chung Jason và Lucia; tiền mặt mang theo thì riêng và có thể mất nếu nhân vật đó gục."},"u":"https://www.gtavice.net/news/esquire-reveals-more-gta-6-details-police-radar-changes-throwable-dog-poop-bags-joint-bank-account-and-more","d":"2026-08-29"},{"id":"heists/story-waits-for-cash","n":{"en":"Story waits for cash","vi":"Cốt truyện chờ tiền"},"s":"official","t":{"en":"Rob Nelson told Edge there are pauses between story missions: sometimes Jason and Lucia must earn money first, by a robbery or a car theft for a fence, before the next job unlocks.","vi":"Rob Nelson nói với Edge rằng giữa các nhiệm vụ có khoảng nghỉ: đôi khi Jason và Lucia phải kiếm đủ tiền trước, bằng một vụ cướp hoặc trộm xe cho chỗ tiêu thụ, thì việc tiếp theo mới mở."},"u":"https://www.tweaktown.com/rss/click/news/114375/?c=news-mf"},{"id":"heists/cash-atm-buckme","n":{"en":"Cash, ATM & BuckMe","vi":"Tiền mặt, ATM & BuckMe"},"s":"report","t":{"en":"Banked money is safe and managed in the BuckMe app; cash on you can be lost if you are Wasted or Busted, so deposit it at an ATM. Loot goes in a bag and only turns into money at a fence.","vi":"Tiền gửi ngân hàng an toàn và quản lý trong ứng dụng BuckMe; tiền mặt trên người có thể mất khi bị Wasted hoặc Busted, nên cần nạp ở cây ATM. Đồ cướp bỏ vào túi và chỉ thành tiền khi bán cho chỗ tiêu thụ."},"u":"https://www.redbull.com/us-en/gta-6-gameplay-details"},{"id":"heists/specialist-fences","n":{"en":"Specialist fences","vi":"Chỗ tiêu thụ chuyên biệt"},"s":"report","t":{"en":"Fences specialise (cars, jewellery and so on) and post lists of what they want. In one demo a fence offered about $21,000 for a stolen car; its condition on arrival changes the payout.","vi":"Mỗi chỗ tiêu thụ chuyên một loại (xe, trang sức...) và đăng danh sách thứ họ cần. Trong một buổi demo, một chỗ trả khoảng 21.000 USD cho chiếc xe trộm; tình trạng xe khi giao ảnh hưởng giá."},"u":"https://www.igrandtheftauto.com/gta6/news/flow-games-reveals-more-gta-6-details-fuel-system-no-first-person-mode-30-fps-and-more"}]},{"k":"life","n":{"en":"Life & stats","vi":"Đời sống & chỉ số"},"x":0,"items":[{"id":"life/empathy-if-you-want-it","n":{"en":"Empathy, if you want it","vi":"Đồng cảm, nếu bạn muốn"},"s":"official","t":{"en":"Rob Nelson says this is the first GTA with mechanics that encourage empathy for players who want them, for example asking a dog's owner before petting it. Crime stays central.","vi":"Rob Nelson nói đây là GTA đầu tiên có cơ chế khuyến khích sự đồng cảm cho người chơi muốn dùng, ví dụ hỏi chủ chó trước khi vuốt ve. Tội phạm vẫn là trọng tâm."},"u":"https://www.vice.com/en/article/gta-6-gameplay-details-guardian-interview/","d":"2026-11-14"},{"id":"life/overheard-talk","n":{"en":"Overheard talk","vi":"Nghe lỏm hội thoại"},"s":"report","t":{"en":"You can overhear pedestrians and interrupt them; reactions range from curiosity and confusion to hostility and insults.","vi":"Có thể nghe lỏm người đi đường và chen ngang; phản ứng từ tò mò, bối rối đến thù địch và chửi bới."},"u":"https://www.keengamer.com/articles/news/rockstar-reveals-new-grand-theft-auto-vi-gameplay-details-days-before-launch/","d":"2026-11-14"},{"id":"life/hands-full","n":{"en":"Hands full","vi":"Tay không rảnh"},"s":"report","t":{"en":"Jason can bite a donut in one hand and sip a beer in the other, eat a hot dog, and run with a six-pack in the crook of his arm while the bottles slosh. From a Guardian newsletter excerpt that circulated as a screenshot; VICE did not check its wording.","vi":"Jason có thể cắn bánh donut một tay và nhấp bia tay kia, ăn hot dog, và chạy với lố bia kẹp trong khuỷu tay, chai bia lắc lư. Trích từ bản tin Guardian lan truyền dưới dạng ảnh chụp; VICE chưa đối chiếu nguyên văn."},"u":"https://www.vice.com/en/article/gta-6-guardian-interview-release-date-new-features/","d":"2026-11-11"},{"id":"life/gore-bodies-in-the-trunk","n":{"en":"Gore & bodies in the trunk","vi":"Máu me & xác trong cốp"},"s":"report","t":{"en":"Per El Rubius via Notebookcheck: full limb dismemberment in combat, and a body can be loaded into a car trunk and driven away. Second-hand creator account, not shown by Rockstar.","vi":"Theo El Rubius qua Notebookcheck: đứt rời tay chân trong giao tranh, và có thể bỏ xác vào cốp xe rồi chở đi. Đây là lời kể lại của creator, Rockstar chưa chiếu."},"u":"https://gtasix.org/en/news/gta6-rockstar-preview-gameplay-details/","d":"2026-09-01"},{"id":"life/gym","n":{"en":"Gym","vi":"Phòng gym"},"s":"official","t":{"en":"Workouts build muscle and strength; training together is a two-for-one for both stats.","vi":"Tập luyện tăng cơ và sức mạnh; tập chung thì cả hai cùng lên chỉ số."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-08-27"},{"id":"life/membership-routine","n":{"en":"Membership & routine","vi":"Thẻ tập & thói quen"},"s":"report","t":{"en":"Buy a membership at the desk; each workout fills a ring of about three exercises. Three days in a row raised strength one point; skip the gym and gains fade. Protein shakes boost the next session.","vi":"Mua thẻ ở quầy; mỗi buổi tập là một vòng khoảng ba bài. Tập ba ngày liền tăng một điểm sức mạnh; bỏ tập thì cơ bắp giảm dần. Sữa protein giúp buổi sau hiệu quả hơn."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"life/health-stamina-focus","n":{"en":"Health · stamina · Focus","vi":"Máu · thể lực · Focus"},"s":"report","t":{"en":"Core attributes grow with activity; food, drinks and cigarettes give short boosts above normal (smoking refills Focus).","vi":"Các chỉ số chính tăng theo hoạt động; đồ ăn, thức uống và thuốc lá cho tăng tạm thời vượt mức (hút thuốc hồi Focus)."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"life/eating-weight","n":{"en":"Eating & weight","vi":"Ăn uống & cân nặng"},"s":"official","t":{"en":"Food restores a lot of health; eating too much makes them gain weight.","vi":"Ăn uống hồi nhiều máu; ăn quá nhiều thì tăng cân."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"life/fighting-styles","n":{"en":"Fighting styles","vi":"Lối đánh"},"s":"report","t":{"en":"Lucia can train kickboxing and MMA; Jason fights rougher, street style.","vi":"Lucia có thể tập kickboxing và MMA; Jason đánh kiểu đường phố, thô hơn."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"life/looks-shopping","n":{"en":"Looks & shopping","vi":"Ngoại hình & mua sắm"},"s":"official","t":{"en":"Both leads are customisable; salons and clothing stores sell items that depend on the area. Groceries, magazines and everyday products can be bought.","vi":"Cả hai nhân vật đều tuỳ biến được; salon và tiệm quần áo bán đồ theo từng khu. Mua được đồ tạp hoá, tạp chí và đồ dùng hằng ngày."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"life/drinking","n":{"en":"Drinking","vi":"Uống rượu"},"s":"report","t":{"en":"Alcohol gets Jason and Lucia drunk.","vi":"Rượu làm Jason và Lucia say."},"u":"https://www.gtavice.net/news/esquire-reveals-more-gta-6-details-police-radar-changes-throwable-dog-poop-bags-joint-bank-account-and-more","d":"2026-08-29"},{"id":"life/personal-vehicle","n":{"en":"Personal vehicle","vi":"Xe cá nhân"},"s":"official","t":{"en":"Can be called at any time and carries the weapons you bought, since only a few big guns fit on you.","vi":"Gọi được bất cứ lúc nào và chứa vũ khí đã mua, vì người chỉ mang được vài khẩu lớn."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"life/safehouses","n":{"en":"Safehouses","vi":"Nhà an toàn"},"s":"report","t":{"en":"Jason and Lucia move between safehouses as the story chapters change; you cannot buy one. Each has their own schedule, so the one you switch to may be out.","vi":"Jason và Lucia chuyển giữa các nhà an toàn khi các chương cốt truyện đổi; không thể mua nhà. Mỗi người có lịch riêng nên người bạn chuyển sang có thể đang ở ngoài."},"u":"https://www.gfinityesports.com/article/how-do-safehouses-work-in-gta-6-customization-supplies-activities-explained","d":"2026-10-07"},{"id":"life/worn-out-looks","n":{"en":"Worn-out looks","vi":"Dáng vẻ phờ phạc"},"s":"report","t":{"en":"All-night benders and multi-day police chases leave Jason and Lucia looking haggard.","vi":"Những đêm nhậu thâu đêm và các cuộc rượt đuổi kéo dài nhiều ngày khiến Jason và Lucia trông phờ phạc."},"u":"https://www.shacknews.com/article/150507/benders-police-chases-affect-jason-lucia-appearance"}]},{"k":"bond","n":{"en":"Relationship","vi":"Mối quan hệ"},"x":0,"items":[{"id":"bond/date-ideas","n":{"en":"Date ideas","vi":"Gợi ý hẹn hò"},"s":"report","t":{"en":"Dates shown: a gym workout, a night at a bar, a meditation retreat, and a liquor-store robbery that counts as a date. There is a button to hold hands; when apart they call and text.","vi":"Các buổi hẹn được thấy: tập gym, đi bar, khoá thiền, và cướp tiệm rượu cũng tính là hẹn hò. Có nút nắm tay; khi ở xa họ gọi và nhắn tin."},"u":"https://www.keengamer.com/articles/news/rockstar-reveals-new-grand-theft-auto-vi-gameplay-details-days-before-launch/","d":"2026-11-14"},{"id":"bond/always-a-pair","n":{"en":"Always a pair","vi":"Luôn là một cặp"},"s":"official","t":{"en":"However you treat them, they can't be split up for good. If one is Wasted during a shared job, both are out.","vi":"Dù đối xử thế nào, hai người không thể chia tay hẳn. Nếu một người gục trong việc chung thì cả hai đều thua."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-08-27"},{"id":"bond/friends-or-lovers","n":{"en":"Friends or lovers","vi":"Bạn hay người yêu"},"s":"report","t":{"en":"They can stay partners and friends or become romantic if you put in the work. Romance is optional and only nudges some story moments.","vi":"Có thể chỉ là cộng sự, bạn bè, hoặc thành người yêu nếu bạn chịu vun đắp. Chuyện tình cảm là tuỳ chọn và chỉ thay đổi chút ít vài đoạn truyện."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-09-29"},{"id":"bond/quality-time","n":{"en":"Quality time","vi":"Thời gian bên nhau"},"s":"official","t":{"en":"Robbing together, walks, holding hands, the zoo, scuba diving, parachuting, the beach, kayaking and the gym all count.","vi":"Cùng đi cướp, đi dạo, nắm tay, sở thú, lặn biển, nhảy dù, bãi biển, chèo kayak và tập gym đều được tính."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"bond/texts-calls","n":{"en":"Texts & calls","vi":"Tin nhắn & cuộc gọi"},"s":"official","t":{"en":"They call or text to meet up and check in. A short reply such as \"OK, goodnight\" is enough; ignoring them can hurt.","vi":"Hai người gọi hoặc nhắn để hẹn gặp và hỏi han. Trả lời ngắn như \"OK, ngủ ngon\" là đủ; lờ đi có thể làm sứt mẻ."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"bond/own-routines","n":{"en":"Own routines","vi":"Lịch sinh hoạt riêng"},"s":"official","t":{"en":"Each has a daily routine, so when you switch the other may be at the safehouse or out in town.","vi":"Mỗi người có lịch sinh hoạt riêng, nên khi đổi nhân vật người kia có thể đang ở nhà hoặc ngoài phố."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"bond/teamwork","n":{"en":"Teamwork","vi":"Phối hợp"},"s":"report","t":{"en":"Time together improves coordination in robberies; leaving your partner in a firefight damages the relationship, shown in the character menu.","vi":"Ở bên nhau nhiều thì phối hợp khi đi cướp tốt hơn; bỏ rơi bạn đồng hành giữa đấu súng làm mối quan hệ xấu đi, thể hiện trong menu nhân vật."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"bond/choices-add-up","n":{"en":"Choices add up","vi":"Lựa chọn tích luỹ"},"s":"official","t":{"en":"Small and big choices both shape outcomes: \"the small ones add up\".","vi":"Cả lựa chọn nhỏ và lớn đều định hình kết quả: \"những cái nhỏ cộng lại sẽ có ý nghĩa\"."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"bond/partner-drives-you-shoot","n":{"en":"Partner drives, you shoot","vi":"Bạn đồng hành lái, bạn bắn"},"s":"official","t":{"en":"In a chase the partner can drive while you shoot from the passenger seat; shooting tyres can send pursuers crashing into each other.","vi":"Khi bị rượt, bạn đồng hành có thể lái còn bạn bắn từ ghế phụ; bắn lốp có thể khiến xe đuổi đâm vào nhau."},"u":"https://www.dexerto.com/gta/gta-6-is-giving-players-more-freedom-to-complete-missions-their-own-way-3416453/"},{"id":"bond/switching-in-missions","n":{"en":"Switching in missions","vi":"Đổi nhân vật trong nhiệm vụ"},"s":"official","t":{"en":"Some missions switch protagonists for you, for example Jason shooting from a car Lucia drives, then control passing to Lucia. Rockstar tested free switching in one mission but kept Jason playable.","vi":"Có nhiệm vụ tự đổi nhân vật: ví dụ Jason bắn từ xe do Lucia lái, rồi quyền điều khiển chuyển sang Lucia. Rockstar từng thử cho đổi tự do trong một nhiệm vụ nhưng giữ Jason làm nhân vật điều khiển."},"u":"https://www.igrandtheftauto.com/gta6/news/famitsu-reveals-gta-6-gameplay-details-garages-pay-and-spray-weapons-robberies-and-more"}]},{"k":"activities","n":{"en":"Activities","vi":"Hoạt động"},"x":0,"items":[{"id":"activities/binoculars-the-wildlife-log","n":{"en":"Binoculars & the wildlife log","vi":"Ống nhòm & sổ ghi động vật"},"s":"report","t":{"en":"Leonida has 62 kinds of birds. In the demo Jason used binoculars to identify a gull on a beach, which added it to a wildlife logbook.","vi":"Leonida có 62 loài chim. Trong demo Jason dùng ống nhòm nhận ra một con mòng biển trên bãi biển và nó được ghi vào sổ động vật."},"u":"https://www.vice.com/en/article/gta-6-gameplay-details-guardian-interview/","d":"2026-11-14"},{"id":"activities/alligators","n":{"en":"Alligators","vi":"Cá sấu"},"s":"official","t":{"en":"Even in a pool in Trailer 1; common in the Grassrivers screenshots.","vi":"Có cả con trong hồ bơi ở Trailer 1; xuất hiện nhiều trong ảnh Grassrivers."},"u":"https://www.gtavice.net/animals","d":"2023-12-04"},{"id":"activities/birds-sea-life","n":{"en":"Birds & sea life","vi":"Chim & sinh vật biển"},"s":"official","t":{"en":"Flamingos, pelicans and gulls; dolphins, manatees, rays and turtles in the water scenes.","vi":"Hồng hạc, bồ nông, mòng biển; cá heo, lợn biển, cá đuối, rùa trong các cảnh dưới nước."},"u":"https://www.gtavice.net/animals","d":"2023-12-04"},{"id":"activities/poach","n":{"en":"POACH","vi":"POACH"},"s":"official","t":{"en":"Protection of Animals & Controlled Hunting, a parody wildlife agency with a social account in Trailer 1.","vi":"Protection of Animals & Controlled Hunting, cơ quan kiểm lâm nhại lại, có tài khoản mạng xã hội trong Trailer 1."},"u":"https://www.gtavice.net/social-media","d":"2023-12-04"},{"id":"activities/pets","n":{"en":"Pets","vi":"Thú nuôi"},"s":"official","t":{"en":"Dogs in Trailer 1, cats and pet snakes in Trailer 2; the Extended Look shows petting a dog.","vi":"Chó trong Trailer 1, mèo và rắn cảnh trong Trailer 2; An Extended Look cho thấy vuốt ve chó."},"u":"https://www.gtavice.net/animals","d":"2025-05-06"},{"id":"activities/sports","n":{"en":"Sports","vi":"Thể thao"},"s":"official","t":{"en":"Basketball, boxing, backyard wrestling, swimming and diving in the Extended Look; pool, mini golf and golf courses in previews.","vi":"Bóng rổ, quyền anh, đấu vật sân sau, bơi và lặn trong An Extended Look; bi-a, golf mini và sân golf trong các bài preview."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-08-27"},{"id":"activities/on-the-water","n":{"en":"On the water","vi":"Trên mặt nước"},"s":"official","t":{"en":"Airboats, jet skis, kayaks and boats through the swamps.","vi":"Thuyền quạt, mô tô nước, kayak và thuyền xuyên đầm lầy."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-08-27"},{"id":"activities/racing-off-road","n":{"en":"Racing & off-road","vi":"Đua xe & địa hình"},"s":"official","t":{"en":"Street and off-road racing, dirt bikes; previews add ATV trails, mud parks, demolition derbies, motocross and mountain biking.","vi":"Đua xe đường phố và địa hình, xe cào cào; các bài preview thêm đường ATV, bãi bùn, đua phá xe, motocross và xe đạp leo núi."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-08-27"},{"id":"activities/nightlife","n":{"en":"Nightlife","vi":"Cuộc sống về đêm"},"s":"official","t":{"en":"Clubbing, dancing and strip clubs; drinking gets you drunk.","vi":"Đi club, nhảy và câu lạc bộ thoát y; uống rượu sẽ say."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-08-27"},{"id":"activities/base-jumping-parachuting","n":{"en":"Base jumping · parachuting","vi":"Nhảy base · nhảy dù"},"s":"official","t":{"en":"Shown in the Extended Look; parachuting also counts as couple time.","vi":"Có trong An Extended Look; nhảy dù cũng tính là thời gian bên nhau."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-08-27"},{"id":"activities/170-species-rarity","n":{"en":"170+ species · rarity","vi":"Hơn 170 loài · độ hiếm"},"s":"report","t":{"en":"Over 170 species (60+ birds, 30+ land mammals, invasive iguanas and macaques). Some are ranked Rare, Discoverable or Legendary.","vi":"Hơn 170 loài (60+ loài chim, 30+ loài thú trên cạn, cả kỳ đà và khỉ ngoại lai). Một số được xếp Hiếm, Khám phá hoặc Huyền thoại."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-09-29"},{"id":"activities/scuba-diving-hiking-zoo","n":{"en":"Scuba diving · hiking · zoo","vi":"Lặn biển · leo núi · sở thú"},"s":"report","t":{"en":"Dive with sharks, whales and turtles (and for treasure), hike the parks, visit the zoo.","vi":"Lặn cùng cá mập, cá voi, rùa (và tìm kho báu), đi bộ đường dài trong công viên, thăm sở thú."},"u":"https://www.gtavice.net/news/everything-we-learned-from-game-informers-exclusive-gta-6-preview","d":"2026-09-29"},{"id":"activities/study-animals","n":{"en":"Study animals","vi":"Nghiên cứu động vật"},"s":"official","t":{"en":"Study wild animals and pets as a collection, a way to deal with wildlife without killing it.","vi":"Quan sát động vật hoang dã và thú nuôi như một bộ sưu tập, cách tương tác với thiên nhiên mà không cần giết."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"},{"id":"activities/fishing-hunting","n":{"en":"Fishing · hunting","vi":"Câu cá · săn bắn"},"s":"report","t":{"en":"Fishing across Leonida (catch and release, bass fishing); hunting earns money through a contact Jason knows.","vi":"Câu cá khắp Leonida (bắt rồi thả, câu cá vược); săn bắn kiếm tiền qua một người quen của Jason."},"u":"https://www.gtavice.net/news/gta-6-youtuber-previews-reveal-even-more-gameplay-details","d":"2026-09-01"},{"id":"activities/ryde-me","n":{"en":"Ryde Me","vi":"Ryde Me"},"s":"official","t":{"en":"The rideshare app is the fast travel; you can also just ride along.","vi":"Ứng dụng gọi xe là cách di chuyển nhanh; cũng có thể ngồi xe đi cùng."},"u":"https://www.gtavice.net/news/igns-full-gta-6-interview-reveals-even-more-gameplay-details","d":"2026-10-07"}]},{"k":"vehicles","n":{"en":"Vehicles","vi":"Xe cộ"},"x":0,"items":[{"id":"vehicles/vapid-stanier-55","n":{"en":"Vapid Stanier ('55)","vi":"Vapid Stanier ('55)"},"s":"official","t":{"en":"Vintage Vice City Pack, the bonus for every pre-order.","vi":"Gói Vintage Vice City, quà cho mọi đơn đặt trước."},"u":"https://www.gtavice.net/vehicles","d":"2026-06-25","im":"slides/Vehicles/25_VV_PACK_VAPID_STANIER_01.jpg"},{"id":"vehicles/vapid-ganado-retro-build","n":{"en":"Vapid Ganado (retro build)","vi":"Vapid Ganado (retro build)"},"s":"official","t":{"en":"Ultimate Edition vehicle.","vi":"Xe của bản Ultimate Edition."},"u":"https://www.gtavice.net/vehicles","d":"2026-06-25","im":"slides/Vehicles/13_UE_VAPID_GANADO_RETRO_BUILD_01.jpg"},{"id":"vehicles/grotti-cheetah","n":{"en":"Grotti Cheetah","vi":"Grotti Cheetah"},"s":"official","t":{"en":"Ultimate Edition sports car.","vi":"Siêu xe của bản Ultimate Edition."},"u":"https://www.gtavice.net/vehicles","d":"2026-06-25"},{"id":"vehicles/squalo","n":{"en":"Squalo","vi":"Squalo"},"s":"official","t":{"en":"Ultimate Edition speedboat.","vi":"Xuồng cao tốc của bản Ultimate Edition."},"u":"https://www.gtavice.net/vehicles","d":"2026-06-25","im":"slides/Vehicles/06_UE_SQUALO_01.jpg"},{"id":"vehicles/stock-305-vapid-buggy","n":{"en":"Stock 305 · Vapid Buggy","vi":"Stock 305 · Vapid Buggy"},"s":"official","t":{"en":"Further Ultimate Edition vehicles shown in its artwork.","vi":"Các xe khác của bản Ultimate Edition, xuất hiện trong ảnh giới thiệu."},"u":"https://www.gtavice.net/vehicles","d":"2026-06-25","im":"slides/Vehicles/10_UE_VAPID_BUGGY_01.jpg"},{"id":"vehicles/full-vehicle-list","n":{"en":"Full vehicle list","vi":"Danh sách đầy đủ"},"s":"report","t":{"en":"About 300 vehicles identified by fans from trailers, screenshots and the Extended Look.","vi":"Khoảng 300 xe được fan nhận diện từ trailer, ảnh và Extended Look."},"u":"https://www.gtabase.com/gta-6/vehicles/","d":"2026-08-27"},{"id":"vehicles/customization-garages","n":{"en":"Customization garages","vi":"Gara độ xe"},"s":"official","t":{"en":"Rockstar's editions announcement names two customization shops: Rideout Customs in Vice City and One-Eyed Willie's at Lake Leonida, both tied to the Ultimate Edition. Its descriptions list body kits, wheels, paint wraps and suspension conversions. No shop menu has been shown in footage yet.","vi":"Thông báo các phiên bản của Rockstar nêu tên hai tiệm độ xe: Rideout Customs ở Vice City và One-Eyed Willie's ở hồ Leonida, cả hai gắn với bản Ultimate Edition. Mô tả liệt kê body kit, mâm, dán decal sơn và độ gầm. Chưa có footage nào cho thấy menu độ xe."},"u":"https://gta-zone.com/news/gta-6-car-customization-tuning/","d":"2026-06-25","im":"slides/Vehicles/01_UE_RIDEOUT_CUSTOMS_01.jpg"},{"id":"vehicles/damage-tyres","n":{"en":"Damage & tyres","vi":"Hư hại & lốp"},"s":"report","t":{"en":"Frame-by-frame analysis found a dent on a Declasse Tulip in Trailer 1 and dirt building up on bodywork in Trailer 2. In the Extended Look, shooting a tyre drops the car onto its rim and can roll it, and shooting the engine can disable it.","vi":"Phân tích từng khung hình thấy vết móp trên một chiếc Declasse Tulip ở Trailer 1 và bụi bẩn bám lên thân xe ở Trailer 2. Trong Extended Look, bắn lốp khiến xe chạy trên vành và có thể lật, bắn vào động cơ có thể làm xe chết máy."},"u":"https://timesaver.gg/blog/gta-6-car-damage-driving-physics-confirmed-2026","d":"2026-08-27"},{"id":"vehicles/heavier-handling","n":{"en":"Heavier handling","vi":"Cảm giác lái nặng hơn"},"s":"report","t":{"en":"Footage analysis shows tighter cornering and more deliberate braking than GTA V's arcade feel, and one report says Rockstar brought in professional racing drivers to refine handling. Rockstar has not published a physics breakdown, so claims about tyre squash or suspension detail are still fan analysis.","vi":"Phân tích footage cho thấy vào cua gọn hơn và phanh có chủ ý hơn kiểu arcade của GTA V, và một bài báo nói Rockstar mời tay đua chuyên nghiệp tinh chỉnh cảm giác lái. Rockstar chưa công bố phân tích vật lý, nên các tuyên bố về độ nén lốp hay chi tiết hệ thống treo vẫn là phân tích của fan."},"u":"https://www.technerdiness.com/gta/gta-6-vehicle-customization-gameplay-reveal/","d":"2026-08-27"},{"id":"vehicles/what-you-can-ride","n":{"en":"What you can ride","vi":"Phương tiện có thể dùng"},"s":"report","t":{"en":"Official footage shows cars, motorcycles and dirt bikes on off-road trails, speedboats such as the Squalo, and a seaplane flown for Brian Heder. The full list is still being built by fans from trailers and screenshots.","vi":"Footage chính thức cho thấy ô tô, mô tô và xe địa hình chạy trên đường mòn, xuồng cao tốc như Squalo, và một thuỷ phi cơ do người của Brian Heder lái. Danh sách đầy đủ vẫn đang được fan ghép lại từ trailer và ảnh."},"u":"https://www.gtabase.com/gta-6/vehicles/","d":"2026-08-27"},{"id":"vehicles/fuel-charging","n":{"en":"Fuel & charging","vi":"Xăng & sạc điện"},"s":"official","t":{"en":"Cars and bikes can run out of fuel; the gauge appears when it runs low. Electric cars use charging stations. Refuelling takes about ten seconds and a full tank lasts a long time. Engine damage changes how a car drives.","vi":"Ô tô và xe máy có thể hết xăng; đồng hồ chỉ hiện khi sắp cạn. Xe điện dùng trạm sạc. Đổ xăng mất khoảng mười giây và một bình đầy đi được rất lâu. Hỏng động cơ làm xe chạy khác đi."},"u":"https://gamingbolt.com/grand-theft-auto-6s-refueling-system-is-pretty-fast-says-co-studio-head","d":"2026-09-07"},{"id":"vehicles/waink-scooter-bros","n":{"en":"Waink & Scooter Bros","vi":"Waink & Scooter Bros"},"s":"report","t":{"en":"The Waink app scans a car for value, security, tracker and the fee to register it as yours; Scooter Bros delivers a personal vehicle. Old cars open with a slim jim, modern ones need a key cloner. A tracker can report the car to police.","vi":"Ứng dụng Waink quét xe để xem giá trị, mức an ninh, thiết bị định vị và phí đăng ký thành xe của bạn; Scooter Bros giao xe cá nhân. Xe cũ mở bằng thanh kim loại, xe đời mới cần thiết bị sao chép chìa khoá. Thiết bị định vị có thể báo xe cho cảnh sát."},"u":"https://vgtimes.com/articles/172804-gta-6-edge-preview-breakdown.html"},{"id":"vehicles/buses-trains-taxis","n":{"en":"Buses, trains & taxis","vi":"Xe buýt, tàu & taxi"},"s":"report","t":{"en":"Rob Nelson says fast travel runs on public transport. Buses and trains are reported to follow fixed routes and timetables; Rockstar has not published a route map.","vi":"Rob Nelson nói đi nhanh dựa vào giao thông công cộng. Xe buýt và tàu được cho là chạy theo tuyến và giờ cố định; Rockstar chưa công bố bản đồ tuyến."},"u":"https://tech4gamers.com/gta-6-seamless-fast-travel-transit/"}]},{"k":"weapons","n":{"en":"Weapons","vi":"Vũ khí"},"x":0,"items":[{"id":"weapons/ammu-nation","n":{"en":"Ammu-Nation","vi":"Ammu-Nation"},"s":"official","t":{"en":"The gun store returns, with its own TV commercial.","vi":"Tiệm súng quay lại, có cả quảng cáo TV."},"u":"https://www.gtavice.net/characters#phil","d":"2025-05-06"},{"id":"weapons/carry-limit","n":{"en":"Carry limit","vi":"Giới hạn mang vũ khí"},"s":"official","t":{"en":"Rob Nelson: you can always conceal two handguns and carry two long guns in the open, one on your back and one in hand. The rest lives in a trunk; only your personal vehicle keeps the full loadout. NPCs react to drawn weapons.","vi":"Rob Nelson: luôn giấu được hai súng ngắn và mang hai súng dài lộ liễu, một đeo lưng, một cầm tay. Phần còn lại để trong cốp; chỉ xe cá nhân giữ nguyên bộ đồ đã chọn. NPC phản ứng khi thấy bạn rút vũ khí."},"u":"https://www.gtaboom.com/gta-6-drops-default-lock-on-limits-guns-sprint-l3-204b","d":"2026-10-07"},{"id":"weapons/aiming-recoil-weapon-hand-off","n":{"en":"Aiming, recoil & weapon hand-off","vi":"Ngắm, độ giật & trao vũ khí"},"s":"report","t":{"en":"Manual aiming is on by default with heavier recoil, the aiming shoulder can be switched, and the cinematic aim camera can be turned off. Jason and Lucia can hand weapons to each other (TGG).","vi":"Ngắm tay là mặc định, độ giật nặng hơn, đổi được vai ngắm và tắt được góc quay điện ảnh khi ngắm. Jason và Lucia có thể trao vũ khí cho nhau (TGG)."},"u":"https://sixlore.com/blog/gta-6-weapons-and-combat","d":"2026-09-02"},{"id":"weapons/hit-markers-gore","n":{"en":"Hit markers & gore","vi":"Dấu trúng đạn & mức máu me"},"s":"report","t":{"en":"White marker for a normal hit, yellow for incapacitation, red for a kill. Gore is higher than GTA V and lower than Red Dead Redemption 2, per Rob Nelson (via Flow Games).","vi":"Trắng là trúng thường, vàng là hạ gục không giết, đỏ là giết. Mức máu me cao hơn GTA V, thấp hơn Red Dead Redemption 2, theo Rob Nelson (qua Flow Games)."},"u":"https://sixlore.com/blog/gta-6-weapons-and-combat","d":"2026-08-30"},{"id":"weapons/concealment-long-guns-lockers","n":{"en":"Concealment, long guns & lockers","vi":"Giấu súng, súng dài & tủ khoá"},"s":"official","t":{"en":"Famitsu interview with Rob Nelson: weapons can no longer be hidden freely and long guns are no longer treated as invisible. Long guns are kept in an Ammu-Nation locker, your personal car, or the trunk of a stolen car while you keep it. Nothing owned is permanently lost, even if you discard it.","vi":"Phỏng vấn Famitsu với Rob Nelson: vũ khí không còn giấu tự do và súng dài không còn 'vô hình'. Súng dài cất trong tủ Ammu-Nation, xe cá nhân, hoặc cốp xe trộm khi bạn còn giữ xe. Đồ đã sở hữu không mất vĩnh viễn kể cả khi vứt."},"u":"https://www.gtavice.net/news/gta-6-famitsus-full-rob-nelson-interview-translated-into-english","d":"2026-08-28"},{"id":"weapons/npc-reactions-suppressive-fire","n":{"en":"NPC reactions & suppressive fire","vi":"Phản ứng của NPC & bắn áp chế"},"s":"official","t":{"en":"Famitsu: walking around with a gun drawn makes people uneasy; they may flee, leave or turn aggressive, and armed NPCs can shoot back. You can fire to miss and frighten people to buy time. Dropping the weapon used in a robbery can lower police suspicion.","vi":"Famitsu: cầm súng đi lại làm người xung quanh khó chịu; họ có thể chạy, bỏ đi hoặc gây hấn, NPC có vũ khí có thể bắn trả. Có thể bắn trượt để doạ và câu giờ. Vứt vũ khí dùng khi cướp có thể giảm nghi ngờ của cảnh sát."},"u":"https://www.gtavice.net/news/gta-6-famitsus-full-rob-nelson-interview-translated-into-english","d":"2026-08-28"},{"id":"weapons/focus-non-lethal-shots","n":{"en":"Focus & non-lethal shots","vi":"Focus & bắn không gây chết"},"s":"official","t":{"en":"Focus slows time while aiming and marks lethal (red) and non-lethal (yellow) points. Enemies can be incapacitated by shooting an arm, a leg or the gun out of their hand.","vi":"Focus làm chậm thời gian khi ngắm và đánh dấu điểm chí mạng (đỏ) và không chí mạng (vàng). Có thể hạ gục bằng cách bắn tay, chân hoặc làm rơi súng khỏi tay đối thủ."},"u":"https://www.keengamer.com/articles/news/gta-6-extended-look-recap-all-gameplay-details/","d":"2026-08-27"},{"id":"weapons/weapon-wheel-pickups","n":{"en":"Weapon wheel & pickups","vi":"Bánh xe vũ khí & nhặt súng"},"s":"official","t":{"en":"The weapon wheel returns redesigned: eight slots, ammo shown on the wheel, a separate Weapons and Items tab. Guns can be picked up from downed enemies mid-fight.","vi":"Bánh xe vũ khí trở lại, thiết kế lại: tám ô, hiện đạn ngay trên bánh xe, có tab Vũ khí và Vật phẩm riêng. Có thể nhặt súng của kẻ địch bị hạ ngay giữa trận."},"u":"https://gta6guru.com/how-weapon-wheel-works-in-gta-6/","d":"2026-08-27"},{"id":"weapons/attachments-finishes","n":{"en":"Attachments & finishes","vi":"Phụ kiện & lớp hoàn thiện"},"s":"report","t":{"en":"The Extended Look shows a red-dot sight, suppressed long guns and a 40-round count on a rifle HUD. No gunsmith screen or attachment list has been shown yet.","vi":"Extended Look cho thấy kính ngắm chấm đỏ, súng dài gắn giảm thanh và số 40 viên trên HUD súng trường. Chưa có màn hình tuỳ chỉnh hay danh sách phụ kiện."},"u":"https://gta6armory.com/guides/weapon-customization","d":"2026-08-27"},{"id":"weapons/hawk-little-morgan-revolvers","n":{"en":"Hawk & Little Morgan Revolvers","vi":"Súng ổ quay Hawk & Little Morgan"},"s":"official","t":{"en":"His-and-hers revolvers with Vice City styling from the Vercetti Estate: palm-tree-etched grips, engraved detailing and a high-performance scope. Ultimate Edition only; whether a plain version exists in the base game is unconfirmed.","vi":"Cặp súng ổ quay cho anh và cho nàng, phong cách Vice City từ Vercetti Estate: báng khắc cây cọ, hoạ tiết chạm khắc và ống ngắm hiệu năng cao. Chỉ có ở Ultimate Edition; chưa rõ bản thường có trong game gốc không."},"u":"https://gtadb.net/gta-6/weapons/morgan-revolver/","d":"2026-06-25","im":"slides/Arms/ULTIMATE_EDITION_HAWK_AND_LITTLE_MORGAN_REVOLVERS_01.jpg"},{"id":"weapons/personalised-sidearms","n":{"en":"Personalised sidearms","vi":"Súng ngắn cá nhân hoá"},"s":"official","t":{"en":"Detailed engravings for Jason's Girardi ES9 pistol and Lucia's Klose K17 pistol. Rockstar also says most guns can take a tropical pattern inspired by Tommy Vercetti's palm-tree shirt.","vi":"Hoạ tiết chạm khắc chi tiết cho súng Girardi ES9 của Jason và Klose K17 của Lucia. Rockstar cũng nói đa số súng có thể gắn hoạ tiết nhiệt đới theo áo cọ của Tommy Vercetti."},"u":"https://www.gta6hype.com/weapons/","d":"2026-06-25"},{"id":"weapons/custom-finish-rifles","n":{"en":"Custom-finish rifles","vi":"Súng trường tuỳ biến"},"s":"report","t":{"en":"A gold compact rifle with a dollar-sign grip and a stars-and-stripes rifle appear in the Extended Look.","vi":"Một khẩu súng trường gọn màu vàng có báng hình đô-la và một khẩu sơn cờ Mỹ xuất hiện trong Extended Look."},"u":"https://gta6armory.com/guides/weapon-customization","d":"2026-08-27"},{"id":"weapons/melee","n":{"en":"Melee","vi":"Cận chiến"},"s":"report","t":{"en":"Bat, crowbar, golf club, hammer, knives, pool cue, wrench. Objects such as a car door can also be used to hit.","vi":"Gậy bóng chày, xà beng, gậy golf, búa, dao, gậy bi-a, cờ lê. Cũng có thể dùng vật thể như cửa xe để đánh."},"u":"https://www.gfinityesports.com/article/gta-6-weapons-guide-every-confirmed-gun-explosive-and-melee-item","d":"2026-08-27"},{"id":"weapons/explosives-throwables","n":{"en":"Explosives · throwables","vi":"Chất nổ · vật ném"},"s":"report","t":{"en":"Grenade and rocket launchers, grenades, Molotovs, flashbangs, smoke grenades.","vi":"Súng phóng lựu, RPG, lựu đạn, Molotov, lựu đạn choáng và khói."},"u":"https://www.gfinityesports.com/article/gta-6-weapons-guide-every-confirmed-gun-explosive-and-melee-item","d":"2026-08-27"},{"id":"weapons/rifles-smgs-shotguns","n":{"en":"Rifles · SMGs · shotguns","vi":"Súng trường · tiểu liên · shotgun"},"s":"report","t":{"en":"Assault and carbine rifles, SMGs, Combat MG, pump and double-barrel shotguns, sniper rifles. Lucia reloads a pump shotgun one-handed in the Extended Look.","vi":"Súng trường tấn công, carbine, tiểu liên, Combat MG, shotgun bơm và hai nòng, súng bắn tỉa. Lucia nạp shotgun bơm bằng một tay trong Extended Look."},"u":"https://www.gfinityesports.com/article/gta-6-weapons-guide-every-confirmed-gun-explosive-and-melee-item","d":"2026-08-27"},{"id":"weapons/handguns","n":{"en":"Handguns","vi":"Súng ngắn"},"s":"report","t":{"en":"Pistol, Heavy Pistol, revolvers, Shocker.","vi":"Pistol, Heavy Pistol, súng ổ quay, Shocker."},"u":"https://www.gfinityesports.com/article/gta-6-weapons-guide-every-confirmed-gun-explosive-and-melee-item","d":"2026-08-27"}]},{"k":"weather","n":{"en":"Weather","vi":"Thời tiết"},"x":0,"items":[{"id":"weather/storms-that-hurt-boats-and-planes","n":{"en":"Storms that hurt boats and planes","vi":"Bão làm hại thuyền và máy bay"},"s":"official","t":{"en":"Aaron Garbut told Edge (issue 430) the weather is 'much more granular' than GTA V's presets: clouds move on their own, storms evolve, and wind-driven waves and gusts affect sailing, can damage aircraft and boats, and send pedestrians looking for shelter.","vi":"Aaron Garbut nói với Edge (số 430) thời tiết 'chi tiết hơn nhiều' so với các preset của GTA V: mây tự di chuyển, bão tiến triển, sóng và gió ảnh hưởng việc đi thuyền, có thể làm hư máy bay, thuyền và khiến người đi đường tìm chỗ trú."},"u":"https://www.gamesradar.com/games/grand-theft-auto/gta-6s-weather-will-rock-your-boat-damage-your-plane-and-send-vice-city-denizens-seeking-shelter","d":"2026-10-29"},{"id":"weather/weather-channel-first-look","n":{"en":"Weather Channel first look","vi":"Weather Channel giới thiệu thời tiết"},"s":"official","t":{"en":"On 16 Nov The Weather Channel said Rockstar gave it an exclusive look at the forecast for Leonida, shown through six new screenshots and weather reports. Scenes include tropical storms, sea fog and murky swamps: a rain-soaked highway under heavy storm clouds (signs point to Hamlet and North Catalan Key) and lightning over dark coastal water beside a pier. GameSpot frames Leonida as a Florida stand-in where sunshine, torrential rain, thunderstorms and tropical storms are all part of the setting. No gameplay effects are detailed.","vi":"Ngày 16/11 The Weather Channel cho biết Rockstar đã cho họ xem độc quyền dự báo thời tiết Leonida, qua sáu ảnh chụp mới và các bản tin thời tiết. Cảnh gồm bão nhiệt đới, sương mù biển và đầm lầy đục ngầu: đường cao tốc ướt mưa dưới mây bão dày (biển chỉ về Hamlet và North Catalan Key) và sét đánh trên mặt nước ven biển cạnh bến tàu. GameSpot mô tả Leonida là bản thay thế Florida, nơi nắng, mưa như trút, giông và bão nhiệt đới đều là một phần của bối cảnh. Chưa có chi tiết về ảnh hưởng tới gameplay."},"u":"https://www.gamespot.com/articles/gta-6-has-teamed-up-with-the-weather-channel-to-show-how-dynamic-leonida-can-be/","d":"2026-11-16"},{"id":"weather/localized-persistent-weather","n":{"en":"Localized, persistent weather","vi":"Thời tiết cục bộ, kéo dài"},"s":"official","t":{"en":"Rockstar's lighting and rendering art lead told Game Informer the weather system was re-engineered to be much more localized and persistent. Dynamic cloudscapes roll across the map, so one area can be soaked while another stays sunny, and the effects linger afterwards.","vi":"Trưởng bộ phận nghệ thuật ánh sáng và dựng hình của Rockstar nói với Game Informer rằng hệ thống thời tiết đã được làm lại để cục bộ và bền hơn nhiều. Mây động trôi khắp bản đồ, nên một vùng có thể ướt sũng trong khi vùng khác vẫn nắng, và hiệu ứng còn đọng lại sau đó."},"u":"https://consequence.net/2026/09/gta-6-weather-system-details/","d":"2026-09-29"},{"id":"weather/tropical-storms-hurricanes","n":{"en":"Tropical storms & hurricanes","vi":"Bão nhiệt đới & siêu bão"},"s":"official","t":{"en":"Rockstar confirmed tropical storms and hurricanes: heavy cloud, strong wind, dense atmosphere and a lot of rain, with water running off roof edges and lampposts, thunder and lightning lighting up the clouds.","vi":"Rockstar xác nhận có bão nhiệt đới và siêu bão: mây dày, gió mạnh, không khí đặc quánh và mưa rất lớn, nước chảy xuống từ mái và cột đèn, sấm chớp thắp sáng các đám mây."},"u":"https://insider-gaming.com/gta-6-weather-system-includes-thunderstorms-hurricanes/","d":"2026-09-29"},{"id":"weather/new-wind-system","n":{"en":"New wind system","vi":"Hệ thống gió mới"},"s":"official","t":{"en":"Wind now includes offshore breezes after sunset, convectional updrafts and occlusion from buildings, so tall blocks shelter the street from the wind. Reports add that gusts move hair, debris, ocean ripples and swamp grass.","vi":"Gió giờ có gió từ biển thổi ra sau hoàng hôn, luồng khí đối lưu bốc lên và bị toà nhà chắn, nên các khối nhà cao che gió cho con phố. Một số bài báo cho biết gió còn làm tóc, mảnh vụn, gợn sóng biển và cỏ đầm lầy chuyển động."},"u":"https://www.forbes.com/sites/brianmazique/2026/10/01/gta-6s-new-weather-system-sounds-ridiculously-detailed/","d":"2026-09-29"},{"id":"weather/wet-world","n":{"en":"Wet world","vi":"Thế giới ướt"},"s":"official","t":{"en":"Puddles and wet ground stay after a storm stops, and the system applies across all six regions, from Vice City to Mount Kalaga.","vi":"Vũng nước và mặt đất ướt còn lại sau khi bão dứt, và hệ thống áp dụng cho cả sáu vùng, từ Vice City đến Mount Kalaga."},"u":"https://www.forbes.com/sites/brianmazique/2026/10/01/gta-6s-new-weather-system-sounds-ridiculously-detailed/","d":"2026-09-29"},{"id":"weather/still-unconfirmed","n":{"en":"Still unconfirmed","vi":"Chưa xác nhận"},"s":"report","t":{"en":"Rockstar has not said whether storms affect missions, cause flooding or damage buildings, how often hurricanes occur, or whether weather can be turned down. As of early October no gameplay footage of the system had been shown, only descriptions.","vi":"Rockstar chưa nói bão có ảnh hưởng nhiệm vụ, gây ngập hay phá hỏng nhà không, siêu bão xuất hiện thường xuyên đến đâu, hay có thể giảm thời tiết không. Đến đầu tháng 10 chưa có footage nào của hệ thống này, chỉ có mô tả."},"u":"https://www.forbes.com/sites/brianmazique/2026/10/01/gta-6s-new-weather-system-sounds-ridiculously-detailed/","d":"2026-09-29"},{"id":"weather/longer-days","n":{"en":"Longer days","vi":"Ngày dài hơn"},"s":"report","t":{"en":"Rob Nelson said GTA V's timings felt too fast at this level of detail, so days and nights run longer. Rockstar has given no length; the 144-minute figure comes from leaked footage and is not used here.","vi":"Rob Nelson nói nhịp thời gian của GTA V quá nhanh với mức chi tiết này nên ngày và đêm dài hơn. Rockstar chưa nêu độ dài; con số 144 phút đến từ footage rò rỉ nên không dùng ở đây."},"u":"https://gamingbolt.com/?p=655884","d":"2026-10-29"}]},{"k":"gangs","n":{"en":"Gangs","vi":"Băng đảng"},"x":0,"items":[{"id":"gangs/ambrosias-biker-gang","n":{"en":"Ambrosia's biker gang","vi":"Băng biker ở Ambrosia"},"s":"official","t":{"en":"Rockstar's Ambrosia page says the Allied Crystal sugar refinery provides the jobs while the local biker gang provides almost everything else. Bikers are seen on a roadside strip in official screenshots.","vi":"Trang Ambrosia của Rockstar nói nhà máy đường Allied Crystal lo việc làm còn băng biker địa phương lo gần như mọi thứ còn lại. Ảnh chính thức có cảnh biker trên dải đường ven đường."},"u":"https://www.rockstargames.com/VI/only-in-leonida","d":"2025-05-06"},{"id":"gangs/final-chapter-mc","n":{"en":"Final Chapter MC","vi":"Final Chapter MC"},"s":"report","t":{"en":"Fans identify the Ambrosia gang as the Final Chapter MC from the patches on its riders' vests in official footage and screenshots. Rockstar itself only says \"the local biker gang\". The patches reportedly carry the year 1982 and a winged skull.","vi":"Fan nhận ra băng ở Ambrosia là Final Chapter MC qua các miếng patch trên áo biker trong footage và ảnh chính thức. Bản thân Rockstar chỉ gọi là \"băng biker địa phương\". Patch được cho là ghi năm 1982 và hình đầu lâu có cánh."},"u":"https://www.gta-6-wiki.com/locations/ambrosia","d":"2025-05-06"},{"id":"gangs/san4san","n":{"en":"San4San","vi":"San4San"},"s":"report","t":{"en":"A Haitian street gang tied to the La Perle neighbourhood of Vice City. Sources disagree on whether Rockstar has shown it officially or whether it first came out in leaks, so treat the details as unconfirmed.","vi":"Băng đường phố gốc Haiti gắn với khu La Perle ở Vice City. Các nguồn bất đồng về việc Rockstar đã cho thấy chính thức hay nó xuất hiện đầu tiên qua rò rỉ, nên chi tiết chưa được xác nhận."},"u":"https://www.gtabase.com/gta-6/gangs/"},{"id":"gangs/territory-gang-wars","n":{"en":"Territory & gang wars","vi":"Địa bàn & chiến tranh băng đảng"},"s":"report","t":{"en":"Rockstar has not said whether the game has gang wars or territory takeovers. What has been shown suggests different crews hold influence over different regions, from Vice City neighbourhoods to Ambrosia. Gang compounds to raid are listed under Robberies.","vi":"Rockstar chưa nói game có chiến tranh băng đảng hay chiếm địa bàn không. Những gì đã thấy cho thấy các nhóm khác nhau nắm ảnh hưởng ở từng vùng, từ các khu của Vice City đến Ambrosia. Sào huyệt băng đảng để đột nhập nằm trong mục Trộm cướp."},"u":"https://www.gtabase.com/gta-6/gangs/"}]},{"k":"radio","n":{"en":"Radio & music","vi":"Radio & nhạc"},"x":0,"items":[{"id":"radio/tom-petty-love-is-a-long-road","n":{"en":"Tom Petty · Love Is a Long Road","vi":"Tom Petty · Love Is a Long Road"},"s":"official","t":{"en":"The song of Trailer 1.","vi":"Bài hát của Trailer 1."},"u":"https://www.gtavice.net/radio-and-soundtrack","d":"2023-12-04"},{"id":"radio/trailer-2-songs","n":{"en":"Trailer 2 songs","vi":"Nhạc Trailer 2"},"s":"official","t":{"en":"Jay Ferguson's Thunder Island, plus tracks by Zenglen, Wang Chung, Tammy Wynette, The Pointer Sisters and The Arrows.","vi":"Thunder Island của Jay Ferguson, cùng các bài của Zenglen, Wang Chung, Tammy Wynette, The Pointer Sisters và The Arrows."},"u":"https://www.gtavice.net/radio-and-soundtrack","d":"2025-05-06"},{"id":"radio/v-rock","n":{"en":"V-Rock","vi":"V-Rock"},"s":"official","t":{"en":"Returning rock station; its new logo is on Jason's T-shirt.","vi":"Đài rock quay lại; logo mới in trên áo của Jason."},"u":"https://www.gtavice.net/radio-and-soundtrack","d":"2025-05-06"},{"id":"radio/vice-city-fm","n":{"en":"Vice City FM","vi":"Vice City FM"},"s":"official","t":{"en":"Seen on a bus-stop ad; unclear if it is a playable station.","vi":"Thấy trên quảng cáo trạm xe buýt; chưa rõ có nghe được trong game không."},"u":"https://www.gtavice.net/radio-and-soundtrack","d":"2026-08-27"},{"id":"radio/extended-look-music","n":{"en":"Extended Look music","vi":"Nhạc An Extended Look"},"s":"official","t":{"en":"About 15 songs play through the video.","vi":"Khoảng 15 bài hát trong video."},"u":"https://www.gtavice.net/radio-and-soundtrack","d":"2026-08-27"},{"id":"radio/in-game-radio-stations","n":{"en":"In-game radio stations","vi":"Đài radio trong game"},"s":"official","t":{"en":"Rockstar revealed the stations, podcasts and the GTA VI album.","vi":"Rockstar công bố các đài, podcast và album GTA VI."},"u":"https://www.rockstargames.com/VI/music","d":"2026-10-08"},{"id":"radio/justice-flower-in-a-hurricane","n":{"en":"Justice · Flower in a Hurricane","vi":"Justice · Flower in a Hurricane"},"s":"official","t":{"en":"Launch Trailer song, with Tame Impala, SZA and King Gizzard & The Lizard Wizard.","vi":"Bài hát của Launch Trailer, cùng Tame Impala, SZA và King Gizzard & The Lizard Wizard."},"u":"https://www.gtavice.net/radio-and-soundtrack","d":"2026-10-15"},{"id":"radio/six-stations","n":{"en":"Six stations","vi":"Sáu đài radio"},"s":"official","t":{"en":"Cocoteo FM, Back Country Radio, AfroBank FM, The Chamber 106.6, Flash FM and Dirty South Classics, spanning Latin, country, African, metal, pop and southern hip-hop.","vi":"Cocoteo FM, Back Country Radio, AfroBank FM, The Chamber 106.6, Flash FM và Dirty South Classics, gồm nhạc Latin, country, châu Phi, metal, pop và hip-hop miền nam."},"u":"https://www.videogameschronicle.com/news/rockstar-reveals-some-of-gta-6s-radio-stations-says-players-can-now-listen-to-the-radio-and-podcasts-on-foot/","d":"2026-10-08"},{"id":"radio/radio-podcasts-on-foot","n":{"en":"Radio & podcasts on foot","vi":"Radio & podcast khi đi bộ"},"s":"official","t":{"en":"A first for the series: on-demand podcasts, and radio and podcasts can be played through earbuds on the phone while on foot.","vi":"Lần đầu của series: podcast theo yêu cầu, và radio lẫn podcast nghe được qua tai nghe gắn điện thoại khi đi bộ."},"u":"https://www.videogameschronicle.com/news/rockstar-reveals-some-of-gta-6s-radio-stations-says-players-can-now-listen-to-the-radio-and-podcasts-on-foot/","d":"2026-10-08"}]},{"k":"phone","n":{"en":"Social media","vi":"Mạng xã hội"},"x":0,"items":[{"id":"phone/in-game-video-feed","n":{"en":"In-game video feed","vi":"Dòng video trong game"},"s":"official","t":{"en":"A TikTok-style feed shown throughout Trailer 1.","vi":"Dòng video kiểu TikTok xuất hiện khắp Trailer 1."},"u":"https://www.gtavice.net/social-media","d":"2023-12-04"},{"id":"phone/officialpoach","n":{"en":"OfficialPOACH","vi":"OfficialPOACH"},"s":"official","t":{"en":"Wildlife agency account warning about uninvited guests at a pool party.","vi":"Tài khoản cơ quan kiểm lâm cảnh báo khách không mời ở tiệc hồ bơi."},"u":"https://www.gtavice.net/social-media","d":"2023-12-04"},{"id":"phone/highrollerzmag","n":{"en":"HighRollerzMag","vi":"HighRollerzMag"},"s":"official","t":{"en":"Car-scene account; its man reappears in the Extended Look.","vi":"Tài khoản giới chơi xe; người của nó xuất hiện lại trong Extended Look."},"u":"https://www.gtavice.net/social-media","d":"2023-12-04"},{"id":"phone/dadbodsquad-have-a-vice-day-zaza-nugget","n":{"en":"DadBodSquad · have.a.vice.day · zaza_nugget","vi":"DadBodSquad · have.a.vice.day · zaza_nugget"},"s":"official","t":{"en":"Some of the other accounts in Trailer 1's feed.","vi":"Một số tài khoản khác trong dòng video của Trailer 1."},"u":"https://www.gtavice.net/social-media","d":"2023-12-04"},{"id":"phone/yomammazjammer","n":{"en":"YoMammazJammer","vi":"YoMammazJammer"},"s":"official","t":{"en":"A post mourning \"Rudi\", one of Trailer 1's named locals.","vi":"Bài viết tưởng nhớ \"Rudi\", một nhân vật có tên trong Trailer 1."},"u":"https://www.gtavice.net/social-media","d":"2023-12-04"},{"id":"phone/streamer","n":{"en":"Streamer","vi":"Streamer"},"s":"official","t":{"en":"Lucia steals a streamer's car while he is live.","vi":"Lucia cướp xe của một streamer khi anh ta đang livestream."},"u":"https://www.gtavice.net/characters#streamer","d":"2026-08-27"}]},{"k":"dev","n":{"en":"Development","vi":"Phát triển"},"x":1,"items":[{"id":"dev/interiors-without-loading","n":{"en":"Interiors without loading","vi":"Nội thất không màn hình tải"},"s":"report","t":{"en":"Reportedly hotels and other buildings can be explored floor by floor, with working elevators and no loading screen. Creator account of the July preview (El Rubius; GTA BOOM and TechWiser relaying).","vi":"Được cho là có thể khám phá khách sạn và các toà nhà theo từng tầng, thang máy chạy thật, không màn hình tải. Lời kể của creator về buổi preview tháng 7 (El Rubius; GTA BOOM và TechWiser lặp lại)."},"u":"https://gtasix.org/en/news/gta6-rockstar-preview-gameplay-details/","d":"2026-09-01"},{"id":"dev/rockstar-studios-worldwide","n":{"en":"Rockstar studios worldwide","vi":"Các studio Rockstar toàn cầu"},"s":"official","t":{"en":"Developed and published by Rockstar Games, led by Rockstar North in Edinburgh.","vi":"Rockstar Games phát triển và phát hành, Rockstar North (Edinburgh) dẫn dắt."},"u":"https://en.wikipedia.org/wiki/Grand_Theft_Auto_VI"},{"id":"dev/in-full-development-since-2020","n":{"en":"In full development since 2020","vi":"Phát triển toàn lực từ 2020"},"s":"official","t":{"en":"Take-Two says development began \"in earnest\" in 2020; UK company filings show spending on it from 2019.","vi":"Take-Two cho biết game được phát triển \"nghiêm túc\" từ 2020; hồ sơ công ty ở Anh cho thấy chi tiêu cho dự án từ 2019."},"u":"https://gamingbolt.com/grand-theft-auto-6-development-began-in-earnest-in-2020-take-two-interactive"},{"id":"dev/announced","n":{"en":"Announced","vi":"Công bố"},"s":"official","t":{"en":"Rockstar confirmed a new Grand Theft Auto was in active development.","vi":"Rockstar xác nhận một phần Grand Theft Auto mới đang được phát triển."},"u":"https://en.wikipedia.org/wiki/Grand_Theft_Auto_VI","d":"2022-02-04"},{"id":"dev/two-delays","n":{"en":"Two delays","vi":"Hai lần hoãn"},"s":"official","t":{"en":"From fall 2025 to 26.05.2026, then to 19.11.2026, to finish the game.","vi":"Từ mùa thu 2025 sang 26.05.2026, rồi sang 19.11.2026, để hoàn thiện game."},"u":"https://www.gameinformer.com/2025/05/02/grand-theft-auto-vi-delayed-to-may-2026","d":"2025-05-02"},{"id":"dev/rage-engine","n":{"en":"RAGE engine","vi":"Engine RAGE"},"s":"report","t":{"en":"Runs on Rockstar's own RAGE (Rockstar Advanced Game Engine), the engine family behind GTA IV, GTA V and Red Dead Redemption 2. Rockstar has not named a version: \"RAGE 9\" is a label used by fans and some sites, not by Rockstar. A former Rockstar audio engineer thinks the team \"probably rebuilt\" most of it for this game. The visible changes (lighting, hair, water) are covered in the lines below.","vi":"Chạy trên engine riêng RAGE (Rockstar Advanced Game Engine), dòng engine từng làm GTA IV, GTA V và Red Dead Redemption 2. Rockstar chưa nêu phiên bản: \"RAGE 9\" là cách gọi của fan và một số trang web, không phải của Rockstar. Một cựu kỹ sư âm thanh của Rockstar cho rằng đội ngũ \"có lẽ đã làm lại\" phần lớn engine cho game này. Những thay đổi nhìn thấy được (ánh sáng, tóc, nước) nằm ở các dòng bên dưới."},"u":"https://gamingbolt.com/gta-6-team-probably-rebuilt-the-entire-rage-engine-says-former-rockstar-audio-engineer","d":"2026-04-03"},{"id":"dev/ray-traced-lighting-reflections","n":{"en":"Ray-traced lighting & reflections","vi":"Ánh sáng & phản chiếu ray tracing"},"s":"report","t":{"en":"Digital Foundry reads the trailers as ray-traced global illumination plus ray-traced reflections on glass, car paint, wet roads and water. It sits alongside older techniques rather than replacing them: screen-space reflections stay on water and planar reflections are kept for mirrors. Rockstar has published no technical breakdown, and analysts expect the lighter console modes (especially Xbox Series S) to cut back.","vi":"Digital Foundry đọc các trailer là có chiếu sáng toàn cục ray tracing (RTGI) cùng phản chiếu ray tracing trên kính, sơn xe, mặt đường ướt và mặt nước. Kỹ thuật này đi cùng các cách cũ chứ không thay hẳn: phản chiếu screen-space vẫn dùng cho mặt nước và phản chiếu phẳng được giữ cho gương. Rockstar chưa công bố phân tích kỹ thuật nào, và giới phân tích dự đoán các chế độ nhẹ trên console (nhất là Xbox Series S) sẽ bị giảm."},"u":"https://gtaintel.com/news/gta-6-ray-tracing-and-lighting","d":"2023-12-04"},{"id":"dev/hair-character-rendering","n":{"en":"Hair & character rendering","vi":"Tóc & dựng nhân vật"},"s":"report","t":{"en":"After the Extended Look, Digital Foundry called the character models the standout visual feature, with a huge generational jump in hair simulation: Lucia's hair moves from root to tip and follows through with a delay, in both cutscenes and live gameplay. \"Strand-based hair\" is the analysts' reading of what is on screen; Rockstar has not described the technique. Close-ups also show sweat, arm hair and fabric that moves separately from the hair.","vi":"Sau Extended Look, Digital Foundry gọi mô hình nhân vật là điểm nổi bật nhất về hình ảnh, với bước tiến lớn của mô phỏng tóc: tóc Lucia chuyển động từ gốc tới ngọn và trễ nhịp theo sau, cả trong cutscene lẫn lúc chơi. \"Tóc dạng sợi\" là cách giới phân tích đọc hình ảnh; Rockstar chưa mô tả kỹ thuật. Các cận cảnh còn cho thấy mồ hôi, lông tay và vải chuyển động tách biệt với tóc."},"u":"https://www.pushsquare.com/news/2026/08/tech-experts-call-gta-6-the-most-impressive-example-of-real-time-rendering-weve-ever-seen","d":"2026-08-27"},{"id":"dev/water-weather","n":{"en":"Water & weather","vi":"Nước & thời tiết"},"s":"report","t":{"en":"The trailers show water that reacts to boats, swimmers and wind, with different wave behaviour in open sea, rivers, lakes and marinas, plus wet surfaces and swamp fog. Digital Foundry notes the water surfaces still lean on screen-space reflections. Claims that Rockstar built a fully physics-simulated water system come from fan sites and are not confirmed.","vi":"Các trailer cho thấy nước phản ứng với thuyền, người bơi và gió, sóng khác nhau ở biển khơi, sông, hồ và bến du thuyền, cùng bề mặt ướt và sương mù đầm lầy. Digital Foundry lưu ý mặt nước vẫn dựa vào phản chiếu screen-space. Tin Rockstar làm hệ thống nước mô phỏng vật lý hoàn toàn đến từ các trang fan và chưa được xác nhận."},"u":"https://gtaintel.com/news/gta-6-strand-hair-and-detail-tech","d":"2025-05-06"},{"id":"dev/digital-foundrys-verdict","n":{"en":"Digital Foundry's verdict","vi":"Đánh giá của Digital Foundry"},"s":"report","t":{"en":"Digital Foundry's analysis of the Extended Look called it the most impressive real-time rendering the outlet has seen. It is an analyst's opinion from video footage, not Rockstar's data.","vi":"Phân tích Extended Look của Digital Foundry gọi đây là màn dựng hình thời gian thực ấn tượng nhất mà kênh từng thấy. Đó là ý kiến của nhà phân tích dựa trên video, không phải số liệu của Rockstar."},"u":"https://www.purexbox.com/news/2026/08/in-depth-gta-6-analysis-hints-at-potential-resolution-and-fps-targets-for-the-full-game","d":"2026-08-27"},{"id":"dev/map-size-length","n":{"en":"Map size & length","vi":"Bản đồ & độ dài"},"s":"official","t":{"en":"Leonida is about three times the size of Red Dead Redemption 2's map; one Rockstar developer's playthrough took about 80 hours.","vi":"Leonida rộng khoảng gấp ba bản đồ Red Dead Redemption 2; một lượt chơi của nhân viên Rockstar mất khoảng 80 giờ."},"u":"https://www.gamesradar.com/news/live/gta-6-extended-look-showcase-live-coverage-2026-everything-announced/","d":"2026-08-27"},{"id":"dev/no-microtransactions-no-generative-ai","n":{"en":"No microtransactions · no generative AI","vi":"Không vi giao dịch · không AI tạo sinh"},"s":"official","t":{"en":"Rockstar says the story game has no microtransactions and no generative AI was used to make it.","vi":"Rockstar cho biết phần chơi cốt truyện không có vi giao dịch và không dùng AI tạo sinh để làm game."},"u":"https://www.gamesradar.com/news/live/gta-6-extended-look-showcase-live-coverage-2026-everything-announced/","d":"2026-08-27"},{"id":"dev/30-fps-on-consoles","n":{"en":"30 fps on consoles","vi":"30 fps trên console"},"s":"report","t":{"en":"Reported to run at 30 fps on PS5 and Xbox Series X|S, with a performance mode undecided and no first-person mode. Rockstar confirmed the 30 fps target on 10 November 2026 (see Platforms & performance).","vi":"Được cho là chạy 30 fps trên PS5 và Xbox Series X|S, chế độ hiệu năng chưa chốt và không có góc nhìn thứ nhất. Rockstar đã xác nhận mục tiêu 30 fps ngày 10.11.2026 (xem Nền tảng & hiệu năng)."},"u":"https://www.gtavice.net/news/flow-games-reveals-more-gta-6-details-fuel-system-no-first-person-mode-30-fps-and-more","d":"2026-08-27"},{"id":"dev/pc-version","n":{"en":"PC version","vi":"Bản PC"},"s":"report","t":{"en":"GamesBeat, citing four industry sources, reports a PC release in Q1 2027. Rockstar hasn't announced it.","vi":"GamesBeat, dẫn bốn nguồn trong ngành, cho biết bản PC ra quý 1/2027. Rockstar chưa công bố."},"u":"https://80.lv/articles/gta-6-is-reportedly-coming-to-pc-in-early-2027","d":"2026-10-13"},{"id":"dev/600-000-npc-animations","n":{"en":"600,000 NPC animations","vi":"600.000 hoạt ảnh NPC"},"s":"official","t":{"en":"Rockstar told The New York Times there are over 600,000 NPC animations, against about 300,000 in Red Dead Redemption 2 and 55,000 in GTA V. Each NPC is art-directed with its own body and behaviour.","vi":"Rockstar nói với The New York Times có hơn 600.000 hoạt ảnh NPC, so với khoảng 300.000 ở Red Dead Redemption 2 và 55.000 ở GTA V. Mỗi NPC được định hướng riêng về thân hình và hành vi."},"u":"https://www.pcgamer.com/games/grand-theft-auto/thanks-to-a-dedicated-team-art-directing-every-single-npc-gta-6-has-over-10-times-as-many-unique-animations-as-gta-5/","d":"2026-08-31"},{"id":"dev/map-vs-gta-v","n":{"en":"Map vs GTA V","vi":"Bản đồ so với GTA V"},"s":"official","t":{"en":"Leonida is roughly twice the size of GTA V's map and Vice City about twice Los Santos; Rockstar says the landmass nearly matches GTA IV, GTA V and RDR2 combined, with many more interiors.","vi":"Leonida rộng khoảng gấp đôi bản đồ GTA V và Vice City khoảng gấp đôi Los Santos; Rockstar nói tổng diện tích gần bằng GTA IV, GTA V và RDR2 cộng lại, với nhiều không gian bên trong hơn hẳn."},"u":"https://www.tweaktown.com/news/114382/gta-6s-map-is-roughly-twice-gta-5s-and-almost-as-big-as-gta-4-gta-5-and-rdr2-combined/index.html"}]},{"k":"mkt","n":{"en":"Marketing","vi":"Quảng bá"},"x":1,"items":[{"id":"mkt/
