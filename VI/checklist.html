rockstar-store-merch-collection","n":{"en":"Rockstar Store merch collection","vi":"Bộ merch Rockstar Store"},"s":"official","t":{"en":"Tees at $29.99, caps, canvas totes, a Vice City Zippo lighter, money clip, keychain and sticker packs, sold only on the Rockstar Store. It ships to about 30 countries and leaves out most of Southeast Asia, India, Brazil and Mexico. Rockstar says more items will follow.","vi":"Áo thun $29.99, mũ, túi canvas, bật lửa Zippo Vice City, kẹp tiền, móc khoá và bộ sticker, chỉ bán trên Rockstar Store. Giao đến khoảng 30 nước, không gồm phần lớn Đông Nam Á, Ấn Độ, Brazil và Mexico. Rockstar cho biết sẽ có thêm sản phẩm."},"u":"https://allthings.how/gta-6-merch-collection-prices-items-and-where-it-ships/","d":"2026-10-08"},{"id":"mkt/collectors-box","n":{"en":"Collector's box","vi":"Hộp sưu tầm"},"s":"official","t":{"en":"The Goodtime State – Vice City Collection: a $399.99 box of physical collectibles, limited to one per customer and sold without the game. Orders ship from 19.11.2026.","vi":"The Goodtime State – Vice City Collection: hộp đồ sưu tầm giá $399,99, mỗi khách một hộp, không kèm game. Đơn hàng giao từ 19.11.2026."},"u":"https://notebookcheck.net/1407016.html","d":"2026-09-24"},{"id":"mkt/miami-kaseya-center-rooftop-sign","n":{"en":"Miami: Kaseya Center rooftop sign","vi":"Miami: biển hiệu trên mái Kaseya Center"},"s":"report","t":{"en":"A giant \"Welcome to Vice City\" sign with the GTA VI logo, lifted onto the roof of the Miami Heat's arena by helicopter. Miami-Dade County reportedly collects $975,000 for it. The arena is the in-game Sahara Arena counterpart, and the sign may stay up into spring 2027.","vi":"Biển hiệu khổng lồ \"Welcome to Vice City\" kèm logo GTA VI, được trực thăng nâng lên mái sân của Miami Heat. Hạt Miami-Dade được cho là thu $975.000. Sân này tương ứng Sahara Arena trong game, và biển có thể ở đó đến mùa xuân 2027."},"u":"https://www.notebookcheck.net/GTA-6-promo-on-Miami-Heat-arena-Here-s-what-it-looks-like-and-how-much-it-cost.1407497.0.html","d":"2026-09-22"},{"id":"mkt/miami-beach-banners-building-wraps","n":{"en":"Miami Beach: banners & building wraps","vi":"Miami Beach: banner & bọc toà nhà"},"s":"report","t":{"en":"Miami Beach cleared GTA VI advertising from 15 October: banners, building wraps and other installations. Beach-chair branding was approved for negotiation but, at the time of the report, not finalised.","vi":"Miami Beach cho phép quảng cáo GTA VI từ 15 tháng 10: banner, bọc toà nhà và các hạng mục khác. Thương hiệu trên ghế bãi biển được duyệt để đàm phán nhưng tại thời điểm đưa tin vẫn chưa chốt."},"u":"https://www.notebookcheck.net/GTA-6-promo-on-Miami-Heat-arena-Here-s-what-it-looks-like-and-how-much-it-cost.1407497.0.html","d":"2026-10-15"},{"id":"mkt/miami-wynwood-walls-murals","n":{"en":"Miami: Wynwood Walls murals","vi":"Miami: tranh tường Wynwood Walls"},"s":"report","t":{"en":"The outdoor art museum unveiled ten murals using GTA VI artwork. Through a partnership with Rockstar, Miami-Dade residents get free admission through 2028, and an official merchandise line was made with the museum.","vi":"Bảo tàng nghệ thuật ngoài trời công bố mười bức tranh tường dùng hình ảnh GTA VI. Nhờ hợp tác với Rockstar, cư dân Miami-Dade được vào cửa miễn phí đến hết 2028, và có một dòng merch chính thức làm cùng bảo tàng."},"u":"https://www.vice.com/en/article/gta-6-marketing-miami-vice-city/"},{"id":"mkt/brooklyn-hand-painted-mural","n":{"en":"Brooklyn: hand-painted mural","vi":"Brooklyn: tranh tường vẽ tay"},"s":"report","t":{"en":"Colossal Media hand-painted a Jason and Lucia mural on a whole building side at Wythe Avenue and North 11th Street in Williamsburg, the same corner as the 2013 GTA V mural. Colossal has painted Rockstar murals since GTA San Andreas in 2004. A painter on the job said it took one to two weeks and is a temporary ad, meant to stay about a month.","vi":"Colossal Media vẽ tay bức tranh Jason và Lucia lên cả một mặt toà nhà ở góc Wythe Avenue và North 11th Street, Williamsburg, đúng góc từng có tranh GTA V năm 2013. Colossal vẽ tranh tường cho Rockstar từ GTA San Andreas năm 2004. Một họa sĩ tham gia cho biết mất một đến hai tuần và đây là quảng cáo tạm, dự kiến chỉ giữ khoảng một tháng."},"u":"https://www.notebookcheck.net/GTA-6-Huge-New-York-mural-nearly-complete-artist-shares-details.1414170.0.html","d":"2026-10-01"},{"id":"mkt/los-angeles-hollywood-boulevard-mural","n":{"en":"Los Angeles: Hollywood Boulevard mural","vi":"Los Angeles: tranh tường Hollywood Boulevard"},"s":"report","t":{"en":"Jason and Lucia were painted on The Lofts building above the Walk of Fame between 15 and 18 October, with a banner and a billboard on Sunset Boulevard. Some people disliked the result because the faces came out in unnatural colours.","vi":"Jason và Lucia được vẽ lên toà The Lofts phía trên Đại lộ Danh vọng từ 15 đến 18 tháng 10, kèm một banner và một biển quảng cáo trên Sunset Boulevard. Một số người không thích kết quả vì gương mặt bị lên màu thiếu tự nhiên."},"u":"https://se7en.ws/gta-6-ads-appear-in-hollywood-including-a-mural-banner-and-billboard/?lang=en","d":"2026-10-15"},{"id":"mkt/new-york-times-square-screen","n":{"en":"New York: Times Square screen","vi":"New York: màn hình Times Square"},"s":"report","t":{"en":"A GTA VI LED billboard went up in Times Square on 15–16 October; the version shown had the guns removed.","vi":"Màn hình LED GTA VI xuất hiện ở Times Square ngày 15–16 tháng 10; bản hiển thị đã bỏ các khẩu súng."},"u":"https://www.llllitl.fr/2026/10/gta-vi-marketing-campaign/","d":"2026-10-15"},{"id":"mkt/paris-ring-road-building-wrap","n":{"en":"Paris: ring-road building wrap","vi":"Paris: bọc toà nhà bên đường vành đai"},"s":"report","t":{"en":"A building-side ad on the Paris périphérique was spotted mid-installation on 6 October. A French fan site estimates it at 175 m and calls it the biggest GTA VI ad so far; that size is unverified. A launch-night screening is planned at the Grand Rex cinema.","vi":"Một quảng cáo bọc mặt toà nhà trên đường vành đai Paris được thấy đang lắp ngày 6 tháng 10. Một trang fan Pháp ước tính dài 175 m và gọi là quảng cáo GTA VI lớn nhất từ trước đến nay; kích thước này chưa được xác minh. Có kế hoạch chiếu đêm ra mắt tại rạp Grand Rex."},"u":"https://www.gtaboom.com/after-miami-and-brooklyn-a-giant-gta-6-ad-is-now-going-up-on-the-paris-ring-road-a0ac","d":"2026-10-06"},{"id":"mkt/magazine-covers-creator-packages","n":{"en":"Magazine covers & creator packages","vi":"Bìa tạp chí & gói quà cho creator"},"s":"report","t":{"en":"The first big press piece was the Dazed cover story on 26 August, followed by a Game Informer cover on 26 September. In the last week of September Rockstar also sent branded packages to creators such as xQc and TheRadBrad.","vi":"Bài báo lớn đầu tiên là bìa Dazed ngày 26 tháng 8, tiếp theo là bìa Game Informer ngày 26 tháng 9. Tuần cuối tháng 9 Rockstar còn gửi gói quà in thương hiệu cho các creator như xQc và TheRadBrad."},"u":"https://leonidainteractive.com/wiki/release/gta-6-marketing-campaign/","d":"2026-08-26"}]},{"k":"editions","n":{"en":"Editions & pricing","vi":"Phiên bản & giá"},"x":0,"items":[{"id":"editions/standard-edition","n":{"en":"Standard Edition","vi":"Bản Standard"},"s":"official","t":{"en":"$79.99 on PS5 and Xbox Series X|S: the full game, sold digitally or as a boxed copy.","vi":"79,99 USD trên PS5 và Xbox Series X|S: trọn bộ game, bán bản số hoặc bản hộp."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/ultimate-edition","n":{"en":"Ultimate Edition","vi":"Bản Ultimate"},"s":"official","t":{"en":"$99.99, digital only: the full game plus 16 story-mode extras, which unlock as the story moves on rather than all at once.","vi":"99,99 USD, chỉ có bản số: trọn bộ game kèm 16 món thêm cho phần cốt truyện, mở dần theo tiến trình chứ không mở hết ngay."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/what-the-ultimate-edition-adds","n":{"en":"What the Ultimate Edition adds","vi":"Bản Ultimate có thêm gì"},"s":"official","t":{"en":"Vehicles: '95 Grotti Cheetah, '67 Vapid Dominator Buggy, Shitzu Squalo, a Classic Car Collection, Jason's safehouse vehicles and the Ganado Retro Build. Weapons: the Hawk & Little Morgan revolvers and personalised weapon variants. Shops: Rideout Customs, One-Eyed Willie's, Sara's Unisex Salon, Stock 305, Electric Fang Tattoo Parlor, Goodtime Gear and the PTT Youngin$ illegal goods store.","vi":"Xe: '95 Grotti Cheetah, '67 Vapid Dominator Buggy, Shitzu Squalo, bộ Classic Car Collection, xe ở nhà an toàn của Jason và Ganado Retro Build. Vũ khí: cặp súng lục ổ quay Hawk & Little Morgan và các biến thể vũ khí cá nhân hoá. Cửa hàng: Rideout Customs, One-Eyed Willie's, Sara's Unisex Salon, Stock 305, Electric Fang Tattoo Parlor, Goodtime Gear và tiệm đồ lậu PTT Youngin$."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/ultimate-edition-upgrade","n":{"en":"Ultimate Edition Upgrade","vi":"Gói nâng cấp Ultimate"},"s":"report","t":{"en":"Standard owners can add the Ultimate content later. The Microsoft Store lists the upgrade at $20.00; the PlayStation Store listed it without a price when Output Lag checked.","vi":"Người mua Standard có thể mua thêm nội dung Ultimate sau. Microsoft Store niêm yết gói nâng cấp 20,00 USD; PlayStation Store có liệt kê nhưng chưa hiện giá lúc Output Lag kiểm tra."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/boxed-copy-a-code-no-disc","n":{"en":"Boxed copy: a code, no disc","vi":"Bản hộp: mã tải, không có đĩa"},"s":"official","t":{"en":"The physical Standard Edition holds a download code; Rockstar support says a disc is not included. PS5 codes are locked to a region group, Xbox codes are not.","vi":"Bản hộp Standard chỉ chứa mã tải; bộ phận hỗ trợ của Rockstar nói không kèm đĩa. Mã PS5 khoá theo nhóm khu vực, mã Xbox thì không."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/vintage-vice-city-pack","n":{"en":"Vintage Vice City Pack","vi":"Gói Vintage Vice City"},"s":"official","t":{"en":"Pre-order bonus, also given for purchases before 20 November 2026: a '55 Vapid Stanier with the Shore Court garage, an outfit and hairstyle each for Jason and Lucia, and a tropical weapon pattern.","vi":"Quà đặt trước, áp dụng cả cho đơn mua trước 20.11.2026: xe '55 Vapid Stanier kèm gara Shore Court, mỗi người Jason và Lucia một bộ đồ và kiểu tóc, cùng một hoạ tiết vũ khí nhiệt đới."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/one-month-of-gta","n":{"en":"One month of GTA+","vi":"Một tháng GTA+"},"s":"official","t":{"en":"Comes with digital purchases only, not the boxed copy. Claim it by 31 March 2027 on PS5, or within 180 days on Xbox. It renews at the normal price until cancelled; Rockstar has not said what GTA+ gives inside GTA VI.","vi":"Chỉ kèm bản số, bản hộp không có. Nhận trước 31.03.2027 trên PS5, hoặc trong 180 ngày trên Xbox. Gói tự gia hạn theo giá thường cho tới khi huỷ; Rockstar chưa nói GTA+ có gì trong GTA VI."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-06-25"},{"id":"editions/prices-outside-the-us","n":{"en":"Prices outside the US","vi":"Giá ngoài nước Mỹ"},"s":"report","t":{"en":"Store listings collected by fan guides: £69.99 and £89.99 in the UK, €79.99 and €99.99 in the euro zone. Prices in other regions differ; check your own store.","vi":"Giá niêm yết do các trang hướng dẫn tổng hợp: 69,99 và 89,99 bảng ở Anh, 79,99 và 99,99 euro ở khu vực euro. Khu vực khác có giá khác; hãy xem cửa hàng của bạn."},"u":"https://www.gtaboss.gg/gta-6/guides/gta-6-preorder-guide"},{"id":"editions/refunds-after-pre-loading","n":{"en":"Refunds after pre-loading","vi":"Hoàn tiền sau khi tải trước"},"s":"report","t":{"en":"On PlayStation, starting the download or pre-load blocks a refund unless the game is faulty, and Automatic Downloads can start it for you. On Xbox, self-service cancellation closed about 10 days before launch.","vi":"Trên PlayStation, một khi đã bắt đầu tải hoặc tải trước thì không được hoàn tiền trừ khi game lỗi, và Automatic Downloads có thể tự bắt đầu tải. Trên Xbox, tự huỷ đơn đã đóng khoảng 10 ngày trước ngày ra mắt."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/"}]},{"k":"platforms","n":{"en":"Platforms & performance","vi":"Nền tảng & hiệu năng"},"x":0,"items":[{"id":"platforms/update-1-002-000-ps5","n":{"en":"Update 1.002.000 (PS5)","vi":"Bản cập nhật 1.002.000 (PS5)"},"s":"report","t":{"en":"First pre-launch update, seen on 13 November: about 1.07 GB on PS5 (Xbox got about 2.2 GB the same day), reported as mandatory, rolled out to half of players first and the rest about 11 hours later. Rockstar has published no patch notes and has not called it a day-one patch.","vi":"Bản cập nhật đầu tiên trước ngày ra mắt, xuất hiện 13.11: khoảng 1,07 GB trên PS5 (Xbox nhận khoảng 2,2 GB cùng ngày), được cho là bắt buộc, phát cho một nửa người chơi trước và nửa còn lại sau khoảng 11 giờ. Rockstar chưa công bố ghi chú bản vá và chưa gọi đây là bản vá ngày đầu."},"u":"https://timesaver.gg/blog/gta-6-update-patch-notes","d":"2026-11-13"},{"id":"platforms/update-01-002-001","n":{"en":"Update 01.002.001","vi":"Bản cập nhật 01.002.001"},"s":"report","t":{"en":"Reported on 16 November as rolling out in groups, from a post by the PlayStation Game Size account. Size and platform are not stated, and Rockstar has published no rollout schedule or notes.","vi":"Được đưa tin ngày 16.11 là đang phát theo từng nhóm, từ bài đăng của tài khoản PlayStation Game Size. Chưa nêu dung lượng và nền tảng, Rockstar chưa công bố lịch phát hay ghi chú."},"u":"https://happygamer.com/gta-6-review-embargo-date-patch-01-002-001-174612/","d":"2026-11-16"},{"id":"platforms/launch-platforms","n":{"en":"Launch platforms","vi":"Nền tảng lúc ra mắt"},"s":"official","t":{"en":"PlayStation 5 (including PS5 Pro) and Xbox Series X|S on 19 November 2026. There is no PlayStation 4 version.","vi":"PlayStation 5 (gồm PS5 Pro) và Xbox Series X|S vào 19.11.2026. Không có bản PlayStation 4."},"u":"https://www.playstation.com/en-ca/games/grand-theft-auto-vi/","d":"2026-06-25"},{"id":"platforms/30-fps-target","n":{"en":"30 fps target","vi":"Mục tiêu 30 fps"},"s":"official","t":{"en":"Rockstar's pre-load post says the game was built for the current consoles and targets 30 frames per second on both platforms, keeping the density and fidelity of Leonida.","vi":"Bài đăng mở tải trước của Rockstar nói game được làm riêng cho thế hệ console hiện tại và nhắm 30 khung hình/giây trên cả hai nền tảng, để giữ mật độ và độ chi tiết của Leonida."},"u":"https://www.rockstargames.com/newswire/article/89834o94713o21/pre-load-grand-theft-auto-vi-now","d":"2026-11-10"},{"id":"platforms/no-performance-mode-announced","n":{"en":"No performance mode announced","vi":"Chưa có chế độ hiệu năng"},"s":"report","t":{"en":"Push Square notes the post names no 40 or 60 fps mode on any console, PS5 Pro included.","vi":"Push Square ghi nhận bài đăng không nêu chế độ 40 hay 60 fps trên máy nào, kể cả PS5 Pro."},"u":"https://www.pushsquare.com/news/2026/11/gta-6-ps5-pro-features-revealed-30fps-target-on-both-consoles","d":"2026-11-10"},{"id":"platforms/ps5-pro","n":{"en":"PS5 Pro","vi":"PS5 Pro"},"s":"official","t":{"en":"Same 30 fps target, with a sharper image from PSSR and ray-traced shadows that only the Pro gets.","vi":"Vẫn mục tiêu 30 fps, hình nét hơn nhờ PSSR và có đổ bóng ray tracing chỉ riêng bản Pro."},"u":"https://www.rockstargames.com/newswire/article/89834o94713o21/pre-load-grand-theft-auto-vi-now","d":"2026-11-10"},{"id":"platforms/dualsense-3d-audio-loading","n":{"en":"DualSense, 3D audio, loading","vi":"DualSense, âm thanh 3D, tải game"},"s":"official","t":{"en":"On PS5 Rockstar lists haptic feedback, Tempest 3D Audio and improved load times, and says the game plays best on PlayStation 5 consoles.","vi":"Trên PS5, Rockstar nêu phản hồi rung haptic, Tempest 3D Audio và thời gian tải nhanh hơn, và nói game chơi tốt nhất trên máy PlayStation 5."},"u":"https://www.rockstargames.com/newswire/article/89834o94713o21/pre-load-grand-theft-auto-vi-now","d":"2026-11-10"},{"id":"platforms/xbox-cloud-gaming","n":{"en":"Xbox Cloud Gaming","vi":"Xbox Cloud Gaming"},"s":"official","t":{"en":"Streamable on Xbox Series X|S and Xbox One consoles, using the Series S graphics settings. Xbox One gets no native version.","vi":"Chơi qua stream trên Xbox Series X|S và Xbox One, dùng thiết lập đồ hoạ của Series S. Xbox One không có bản chạy trực tiếp."},"u":"https://www.rockstargames.com/newswire/article/89834o94713o21/pre-load-grand-theft-auto-vi-now","d":"2026-11-10"},{"id":"platforms/remote-play","n":{"en":"Remote Play","vi":"Remote Play"},"s":"official","t":{"en":"Supported on both PlayStation and Xbox, streaming from your console to another device.","vi":"Hỗ trợ trên cả PlayStation và Xbox, stream từ console sang thiết bị khác."},"u":"https://twistedvoxel.com/gta-vi-30-fps-ps5-xbox/","d":"2026-11-10"},{"id":"platforms/up-to-212-gb","n":{"en":"Up to 212 GB","vi":"Tối đa 212 GB"},"s":"official","t":{"en":"Rockstar asks for up to 212 GB of free space, depending on the device. Microsoft's catalogue lists 225.3 GB. Both are download requirements, not a confirmed installed size.","vi":"Rockstar yêu cầu tối đa 212 GB trống, tuỳ thiết bị. Danh mục của Microsoft ghi 225,3 GB. Cả hai là dung lượng cần để tải, chưa phải dung lượng cài đặt chính thức."},"u":"https://outputlag.com/guides/gta-6-editions-pre-order-bonus/","d":"2026-11-10"},{"id":"platforms/pre-load","n":{"en":"Pre-load","vi":"Tải trước"},"s":"official","t":{"en":"Opened on 10 November for digital pre-orders, moved up from the 12 November date announced earlier.","vi":"Mở ngày 10.11 cho đơn đặt trước bản số, const idb = (() => { let dbp=null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r=indexedDB.open("vi_jr", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("m"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => { const t=db.transaction("m", mode), q=fn(t.objectStore("m"));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }));
  return { put:(k,v)=>run("readwrite", s=>s.put(v,k)), get:k=>run("readonly", s=>s.get(k)), del:k=>run("readwrite", s=>s.delete(k)) }; })();

async function shrink(file, max=1920, q=.86){
  let bmp=null; try{ bmp = await createImageBitmap(file); }catch(e){}
  if(!bmp) return file;
  const k=Math.min(1, max/Math.max(bmp.width, bmp.height)), w=Math.round(bmp.width*k), h=Math.round(bmp.height*k);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
  return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", q)); }

const KEYS = [];
(() => { const seen=new Set();
  const add = (kw, id, c) => { kw=norm(kw).trim(); if(kw.length<3 || STOP.has(kw)) return; const key=kw+"|"+id; if(seen.has(key)) return; seen.add(key); KEYS.push([kw, id, c]); };
  CATS.forEach(c => { if(c.x) return;   /* development and marketing facts are not looked for in journal text */
    (CAT_KW[c.k]||[]).forEach(w => KEYS.push([norm(w).trim(), null, c.k]));
    c.items.forEach(it => { (ALIAS[it.id]||[]).forEach(a => add(a, it.id, c.k));
      [it.n.en, it.n.vi].forEach(nm => { if(!nm) return; add(nm, it.id, c.k);
        nm.split(/\s*(?:·|&|\/|,|\(|\)|:|\+)\s*/).forEach(p => { if(p.length>=4) add(p, it.id, c.k); });
        if(c.k==="people") nm.split(/[\s'’]+/).forEach(p => { if(p.length>=4) add(p, it.id, c.k); }); }); }); }); })();
function detect(text){ const h=norm(text), items=new Set(), cats=new Set();

  const doms=Object.entries(dom).map(([h,l]) => [h, acc(l)]).filter(([,a]) => a.n).sort((x,y) => y[1].n-x[1].n || (y[1].p??0)-(x[1].p??0));
  const cats=CATS.filter(c => !c.x).map(c => { const g=c.items.filter(it => resOf(it)!=="na"); return [c, acc(c.items), g.filter(it => resOf(it)!=="").length, g.length]; });
  $("hero").innerHTML = `<section class="hero"><div class="big ${o.n?tone(o.p):""}">${o.p==null ? "—" : Math.round(o.p*100)+"<small>%</small>"}</div>
    <div><div class="verdict">${verdict(o)}</div>
      <p class="mono muted" style="margin:7px 0 0">✓ ${o.a.ok} · ◐ ${o.a.part} · ✕ ${o.a.no} · ${L("đã kiểm","checked")} ${done}/${inGame.length}</p>
      <div class="bars">${["official","report"].map(s => barRow(`<i class="pill ${s}">${s}</i>`, acc(ALL.filter(it => it.s===s)))).join("")}</div>
      <div class="prog" title="${done}/${inGame.length}"><u style="width:${inGame.length ? Math.round(done/inGame.length*100) : 0}%"></u></div></div></section>
    <details class="by"><summary class="mono"><span>${L("Độ chính xác theo nguồn tin","Accuracy by source")}</span><span>${doms.length}</span></summary>
      <div class="bars">${doms.length ? doms.map(([h,a]) => barRow(esc(h), a)).join("") : `<p class="muted" style="margin:0">${L("Chưa có mục nào được kiểm.","Nothing checked yet.")}</p>`}</div></details>
    <details class="by"><summary class="mono"><span>${L("Theo nhóm Gameplay","By Gameplay category")}</span><span>${cats.length}</span></summary>
      <div class="bars">${cats.map(([c,a,d,t]) => barRow(`<a href="#c-${c.k}" data-cat="${c.k}">${esc(tr(c.n))}</a>`, a, `${L("đã kiểm","checked")} ${d}/${t}`)).join("")}</div></details>
    <p class="note">${L("Cách tính: ✓ Đúng = 1 · ◐ Một phần = ½ · ✕ Sai = 0, chia cho số mục đã kiểm. Mục chưa kiểm và mục ngoài game (Phát triển, Quảng bá) không tính. Số nhỏ cạnh % là số mục đã kiểm.","How it is worked out: ✓ True = 1 · ◐ Partly = ½ · ✕ False = 0, divided by the items checked. Unchecked and out-of-game items (Development, Marketing) are left out. The small number next to the % is how many were checked.")}</p>`; }
const passS = it => F.s==="all" || it.s===F.s;
const passC = it => F.c==="all" || it.c===F.c;
const passQ = it => !F.q || norm(tr(it.n)+" "+tr(it.t)+" "+(CK.it[it.id]?.n||"")).includes(norm(F.q).trim());
const passR = it => F.r==="all" || resOf(it)===F.r;
function renderCtl(){
  const n={all:0, "":0, ok:0, part:0, no:0, na:0}; ALL.forEach(it => { if(passS(it) && passC(it) && passQ(it)){ n.all++; n[resOf(it)]++; } });
  $("fR").setAttribute("aria-label", L("Lọc theo kết quả","Filter by result"));
  $("fR").innerHTML = [["all",L("Tất cả","All")],["",L("Chưa kiểm","Unchecked")],["ok",L("Đúng","True")],["part",L("Một phần","Partly")],["no",L("Sai","False")],["na",L("Ngoài game","N/A")]]
    .map(([k,t]) => `<button type="button" data-fr="${k}" aria-pressed="${F.r===k}">${t}<sup>${n[k]}</sup></button>`).join("");
  $("fS").setAttribute("aria-label", L("Lọc theo trạng thái nguồn","Filter by status"));
  $("fS").innerHTML = [["all",L("Mọi nguồn","All")],["official","Official"],["report","Report"]].map(([k,t]) => `<button type="button" data-fs="${k}" aria-pressed="${F.s===k}">${t}</button>`).join("");
  $("q").placeholder = L("Tìm mục, nội dung tin, bài kiểm chứng…","Search items, claims, your notes…");
  $("fC").innerHTML = `<button type="button" class="chip" data-fc="all" aria-pressed="${F.c==="all"}">${L("Mọi nhóm","All")}</button>`
    + CATS.map(c => `<button type="button" class="chip" data-fc="${c.k}" aria-pressed="${F.c===c.k}">${esc(tr(c.n))}<sup>${c.items.length}</sup></button>`).join(""); }
function evHTML(ev){ const us=String(ev||"").split(/\s+/).filter(u => /^https?:\/\//i.test(u)); if(!us.length) return "";
  return `<div class="ev">${us.map(u => { const y=ytParse(u); return `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${y ? "▶ "+fmtT(y.s) : isImgURL(u) ? L("Ảnh","Photo") : esc(host(u))} ↗</a>`; }).join("")}</div>`; }
function rowHTML(it){
  const r=resOf(it), d=CK.it[it.id]||{}, js=(JRL[it.id]||[]).slice().sort((a,b) => (b.d||"").localeCompare(a.d||"")), h=host(it.u), cur=RES().find(x => x[0]===r);
  const open = d.n || d.ev ? " open" : "";
  return `<article class="ci r-${r||"un"}" id="i-${esc(it.id)}" data-id="${esc(it.id)}">
    <div><h3>${esc(tr(it.n))}</h3>
      <div class="meta mono"><span>${it.d ? dmy(it.d) : L("chưa rõ ngày","date unknown")}</span><i class="pill ${it.s}">${it.s}</i>${h ? `<a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(h)} ↗</a>` : ""}<span class="st">${r && r!=="na" ? cur[1]+" "+cur[2] : ""}</span></div>
      <p class="claim"><span class="mono lb">${L("Tin","Claim")}</span>${esc(tr(it.t))}</p></div>
    <div class="vd" role="group" aria-label="${L("Kết quả trong game","Result in the game")}">${RES().map(([k,g,t]) => `<button type="button" data-r="${k}" aria-pressed="${r===k}"${EDIT?"":" disabled"}><b>${g}</b><span>${t}</span></button>`).join("")}</div>
    <details class="pf"${open}><summary class="mono">${L("Kiểm chứng","Verification")}${d.n ? " · "+L("đã viết","written") : ""}${js.length ? ` · ${js.length} ${L("bài nhật ký","journal")}` : ""}${d.at ? " · "+dmy(isoDay(d.at)) : ""} <span class="saved">✓ ${L("đã lưu","saved")}</span></summary>
      <div class="in">${EDIT
        ? `<textarea data-k="n" rows="3" placeholder="${L("Thực tế trong game: bạn thấy gì, ở đâu, khác tin thế nào…","In the game: what you saw, where, and how it differs from the news…")}">${esc(d.n||"")}</textarea>
           <textarea data-k="ev" rows="2" placeholder="${L("Link bằng chứng: ảnh, clip VOD (YouTube có ?t=)… mỗi dòng một link","Evidence links: photos, VOD clips (YouTube with ?t=)… one per line")}">${esc(d.ev||"")}</textarea>`
        : (d.n ? `<p class="rv">${esc(d.n)}</p>` : "")}
        ${evHTML(d.ev)}
        <div class="jl">${js.map(e => `<a class="chip" href="journal.html#e-${esc(e.id)}">${dmy(e.d)} · ${esc(e.t || L("Không tiêu đề","Untitled"))}</a>`).join("")}${EDIT ? `<a class="chip auto" href="journal.html#new=${encodeURIComponent(it.id)}">＋ ${L("Viết nhật ký cho mục này","Write a journal entry for this")}</a>` : ""}${!js.length && !EDIT ? `<span class="muted">${L("Chưa có bài nhật ký nhắc tới mục này.","No journal entry mentions this yet.")}</span>` : ""}</div></div>
    </details></article>`; }
function renderList(){
  const groups = CATS.map(c => [c, c.items.filter(it => passR(it) && passS(it) && passC(it) && passQ(it))]).filter(([,l]) => l.length);
  $("list").innerHTML = groups.length ? groups.map(([c,l]) => { const a=acc(c.items);
    return `<section class="cat" id="c-${c.k}"><h2>${esc(tr(c.n))}<small>${l.length} ${L("mục","items")} · ${c.x ? L("ngoài game, không tính","out of game, not counted") : pct(a.p)+" "+L("đúng","right")}</small></h2>${l.map(rowHTML).join("")}</section>`; }).join("")
    : `<p class="empty">${L("Không có mục nào khớp bộ lọc.","Nothing matches the filters.")}</p>`; }
function renderBk(){
  $("bk").innerHTML = EDIT ? `<p>${L("Bản demo: kết quả và bài kiểm chứng đang lưu trong trình duyệt này. Sao lưu ra file để không mất khi xoá dữ liệu trình duyệt hoặc đổi máy.","Demo: results and notes are kept in this browser. Back them up to a file so they are not lost when the browser data is cleared or you switch devices.")}</p>
    <button type="button" class="btn" id="bkO">${L("Sao lưu ra file","Back up to a file")}</button><label class="btn">${L("Nạp từ file","Load from a file")}<input type="file" id="bkI" accept="application/json,.json" hidden></label>`
    : `<p>${L("Bản xem: kết quả kiểm chứng sẽ hiện ở đây khi được đăng.","View only: the results will show here once they are published.")}</p>`; }
function renderAll(){
  $("topbar").innerHTML = topHTML("ck");
  $("sub").textContent = L("Mỗi mục Gameplay: tin nói gì và game thật ra sao. Chọn kết quả rồi viết phần kiểm chứng; tỉ lệ chính xác của tin tự tính lại.","Each Gameplay item: what the news said and what the game really shows. Pick a result, write your verification; the accuracy of the news is worked out as you go.");
  $("navslot").innerHTML = navHTML("ck");
  renderHero(); renderCtl(); renderList(); renderBk(); }
function setRes(id, r){
  const o = CK.it[id] || (CK.it[id] = {}); o.r = r; o.at = Date.now();
  if(!store.set(CK_KEY, CK)) return;
  const el = document.getElementById("i-"+id), was = el?.querySelector("details")?.open;
  if(el){ el.outerHTML = rowHTML(ITEMS[id]); if(was) document.getElementById("i-"+id).querySelector("details").open = true; }
  renderHero(); renderCtl(); }
document.addEventListener("click", e => {
  const r=e.target.closest("[data-r]"); if(r && EDIT){ setRes(r.closest(".ci").dataset.id, r.dataset.r); return; }
  const fr=e.target.closest("[data-fr]"); if(fr){ F.r=fr.dataset.fr; renderCtl(); renderList(); return; }
  const fs=e.target.closest("[data-fs]"); if(fs){ F.s=fs.dataset.fs; renderCtl(); renderList(); return; }
  const fc=e.target.closest("[data-fc]"); if(fc){ F.c = fc.dataset.fc===F.c ? "all" : fc.dataset.fc; renderCtl(); renderList(); return; }
  const dc=e.target.closest("[data-cat]"); if(dc){ e.preventDefault(); F.c=dc.dataset.cat; F.r="all"; renderCtl(); renderList(); $("ctl").scrollIntoView({behavior:"smooth"}); return; }
  if(e.target.closest("#bkO")) download(`afterrock-checklist-${today()}.json`, JSON.stringify({kind:"afterrock-checklist", ...CK}));
});
let qT=0; $("q").addEventListener("input", () => { clearTimeout(qT); qT=setTimeout(() => { F.q=$("q").value.trim(); renderCtl(); renderList(); }, 200); });
/* notes are saved as you type */
let sT=0;
document.addEventListener("input", e => { const ta=e.target.closest(".pf [data-k]"); if(!ta || !EDIT) return;
  const ci=ta.closest(".ci"), id=ci.dataset.id, o=CK.it[id] || (CK.it[id]={}); o[ta.dataset.k]=ta.value; o.at = o.at || Date.now();
  clearTimeout(sT); sT=setTimeout(() => { if(store.set(CK_KEY, CK)){ const s=ci.querySelector(".saved"); s.classList.add("on"); setTimeout(() => s.classList.remove("on"), 1200); } }, 400); });
document.addEventListener("change", async e => {
  const ta=e.target.closest(".pf [data-k='ev']"); if(ta){ const ci=ta.closest(".ci"), box=ci.querySelector(".in"); box.querySelector(".ev")?.remove(); ta.insertAdjacentHTML("afterend", evHTML(ta.value)); return; }
  if(e.target.id==="bkI" && e.target.files[0]){ try{ const o=JSON.parse(await e.target.files[0].text()); if(!o || typeof o.it!=="object") throw 0;
      Object.entries(o.it).forEach(([id,v]) => { if(ITEMS[id]) CK.it[id] = Object.assign(CK.it[id]||{}, v); }); store.set(CK_KEY, CK); renderAll(); toast(L("Đã nạp dữ liệu kiểm chứng.","Loaded.")); }
    catch(x){ toast(L("File không đúng định dạng.","Not a checklist backup file.")); } e.target.value=""; } });
/* checklist.html#i=<item id> opens that item; #c-<category> jumps to the category */
function fromHash(){ const h=decodeURIComponent(location.hash.slice(1)); if(!h.startsWith("i=")) return; const id=h.slice(2); if(!ITEMS[id]) return;
  F={r:"all", s:"all", c:"all", q:""}; $("q").value=""; renderCtl(); renderList();
  const el=document.getElementById("i-"+id); if(!el) return; el.querySelector("details").open=true; el.classList.add("hit"); el.scrollIntoView({block:"start"}); }
addEventListener("hashchange", fromHash);
addEventListener("storage", e => { if(e.key===JR_KEY){ loadJR(); renderList(); } if(e.key===CK_KEY){ CK=store.get(CK_KEY, CK); renderHero(); renderCtl(); renderList(); } });
wireTop(renderAll);
loadJR(); renderAll(); fromHash();
</script>
